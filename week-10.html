<script>
const {W} = Lecture; Lecture.__noLogo=true; const esc = W.esc;
const {T, fr, sq, SG, XB, PH, v} = F;
const goScene = i => { const b=document.querySelectorAll('.toc ol li button')[i]; if(b) b.click(); };
const practice = (items, label) => el => W.practice(el, items, {label: label||'Show answer', prefix: ''});
const FT='font-family="Schibsted Grotesk,Arial"', MONO='font-family="JetBrains Mono,monospace"';
/* board model answers for practice: BA / Board from assets/board-answers.js and assets/board.js */
const Bd=Board, MA=(...p)=>{ const li=p.map(x=>!!x.b).lastIndexOf(true); return p.map((x,i)=>x.b?(i===li?BA.board(x.b):Bd.make(x.b)):BA.steps(x.s)).join(''); };
const z2=z=>z.toFixed(2).replace('-','−'), ok2=z=>Math.abs(z*100-Math.round(z*100))<1e-9;
/* SE = σ / √n */
function gSE(s,n,o={}){ const r=Math.sqrt(n), se=s/r, ex=Number.isInteger(r);
  return {t:o.t||'SE',lines:[Bd.fr('SE','σ','√n',{n:`σ = ${s}`,d:`n = ${n}`}),Bd.fr('SE',String(s),`√${n}`,{plain:true}),
    Bd.line(`SE = ${ex?Bd.frac(String(s),String(r))+' = ':'≈ '}<b>${ex?BA.num(se):se.toFixed(3)}</b>`,'ans')],calc:[`${s}÷√(${n})`,BA.lcd(se)]}; }
/* z = (x̄ − μ) / (σ / √n), whole entry on the calculator */
function gZbar(xb,mu,s,n,o={}){ const se=s/Math.sqrt(n), z=(xb-mu)/se, XB=BA.XB, seT=Number.isInteger(se*100)?BA.num(se):se.toFixed(3);
  return {t:o.t||'z',lines:[Bd.fr('z',`${XB} − μ`,'σ ÷ √n',{n:`${XB} = ${xb}, μ = ${mu}`,d:`σ = ${s}, n = ${n}`}),Bd.fr('z',`(${xb} − ${mu})`,`(${s} ÷ √${n})`,{plain:true}),
    Bd.line(`z = ${Bd.frac(BA.num(xb-mu),seT)} ${ok2(z)?'=':'≈'} <b>${z2(z)}</b>`,'ans')],calc:[`(${xb}−${mu})÷(${s}÷√(${n}))`,BA.lcd(z)]}; }
function gZ(x,mu,s,o={}){ const z=(x-mu)/s;
  return {t:o.t||'z',lines:[Bd.fr('z','x − μ','σ',{n:`x = ${x}, μ = ${mu}`,d:`σ = ${s}`}),Bd.fr('z',`(${x} − ${mu})`,String(s),{plain:true}),
    Bd.line(`z = ${Bd.frac(BA.num(x-mu),String(s))} ${ok2(z)?'=':'≈'} <b>${z2(z)}</b>`,'ans')],calc:[`(${x}−${mu})÷${s}`,BA.lcd(z)]}; }
function gRight(z,phi,lhs){ const v=1-phi;
  return {t:'Right tail',lines:[Bd.line(`P = 1 − Φ(<span class="g">z</span>)`),Bd.dec([[`Φ(${z})`,`${phi} (table)`]]),Bd.line(`${lhs} = 1 − ${phi} = <b>${BA.r4(v).padEnd(6,'0')}</b>`,'ans')],calc:[`1−${phi}`,BA.lcd(v)]}; }
/* five sample means on a number line, μ = 32 */
const meansSVG=(()=>{ const X=x=>40+(x-26)*36, ms=[29.8,33.1,31.4,34.0,30.6];
  return `<svg viewBox="0 0 520 150" role="img" aria-label="Five sample means around the population mean of 32 minutes"><line x1="40" x2="400" y1="110" y2="110" stroke="var(--ink)"/>
  ${[26,28,30,32,34,36].map(t=>`<line x1="${X(t)}" x2="${X(t)}" y1="110" y2="115" stroke="var(--muted)"/><text x="${X(t)}" y="130" text-anchor="middle" ${MONO} font-size="11" fill="var(--muted)">${t}</text>`).join('')}
  <line x1="${X(32)}" x2="${X(32)}" y1="22" y2="110" stroke="var(--wk)" stroke-width="2" stroke-dasharray="5 4"/><text x="${X(32)}" y="16" text-anchor="middle" ${FT} font-weight="700" font-size="12" fill="var(--wk)">μ = 32</text>
  ${ms.map((m,i)=>`<line x1="${X(m)}" x2="410" y1="${96-i*15}" y2="${96-i*15}" stroke="var(--line)"/><circle cx="${X(m)}" cy="${96-i*15}" r="6" fill="var(--c2)"/><text x="416" y="${100-i*15}" ${MONO} font-size="12" fill="var(--ink)">x̄${'₁₂₃₄₅'[i]} = ${m.toFixed(1)}</text>`).join('')}
  <text x="220" y="147" text-anchor="middle" ${FT} font-size="11" fill="var(--muted)">Commute time (min)</text></svg>`; })();
/* sampling distributions of x̄ for n = 4, 36, 144 (μ = 32, σ = 12) */
const seSVG=(()=>{ const a=12, b=52, X=x=>20+(x-a)*12, base=150;
  const curve=(se,col,w)=>{ const pts=[]; for(let i=0;i<=200;i++){ const x=a+(b-a)*i/200; pts.push(`${X(x)},${base-118*Math.exp(-(((x-32)/se)**2)/2)/se}`); } return `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="${w}"/>`; };
  return `<svg viewBox="0 0 520 190" role="img" aria-label="Sampling distributions of the mean for n = 4, 36 and 144">${curve(6,'var(--muted)',2)}${curve(2,'var(--c2)',2.4)}${curve(1,'var(--wk)',2.6)}
  <line x1="20" x2="500" y1="${base}" y2="${base}" stroke="var(--ink)"/>${[12,22,32,42,52].map(t=>`<text x="${X(t)}" y="${base+16}" text-anchor="middle" ${MONO} font-size="11" fill="var(--muted)">${t}</text>`).join('')}
  <text x="${X(33.4)}" y="22" ${FT} font-weight="700" font-size="12" fill="var(--wk)">n = 144 · SE = 1</text><text x="${X(35.2)}" y="96" ${FT} font-weight="700" font-size="12" fill="var(--c2)">n = 36 · SE = 2</text><text x="${X(40)}" y="132" ${FT} font-weight="700" font-size="12" fill="var(--muted)">n = 4 · SE = 6</text>
  <text x="260" y="186" text-anchor="middle" ${FT} font-size="11" fill="var(--muted)">Sample mean x̄ (min)</text></svg>`; })();

/* ---------- concept graphics (one per topic, beside the definition) ---------- */
const G10=(()=>{ const {svg,card,text,arrow,pill,bell,bellArea,zx,axis}=CG;
  /* parameter fixed, statistic changes */
  let sd=7; const rnd=()=>{ sd=(sd*16807)%2147483647; return sd/2147483647; };
  const dots=[...Array(34)].map(()=>[40+rnd()*170,58+rnd()*104]);
  const smp=[[380,58,'x̄₁ = 30.9'],[380,128,'x̄₂ = 33.4'],[380,198,'x̄₃ = 31.7']];
  const vari=svg(520,250,
    card(20,22,210,152)+text(125,46,'Population',{a:'middle',s:15,w:700})+dots.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="var(--wk)" fill-opacity=".55"/>`).join('')+
    pill(30,190,190,34,'μ: one fixed value')+
    smp.map(([x,y,l],i)=>arrow(236,98,x-34,y,'var(--muted)',1.8)+`<circle cx="${x}" cy="${y}" r="26" fill="var(--c2)" fill-opacity=".12" stroke="var(--c2)" stroke-width="1.5"/>`+
      [[-9,-8],[8,-10],[0,4],[-10,10],[10,9]].map(([dx,dy])=>`<circle cx="${x+dx}" cy="${y+dy}" r="3.5" fill="var(--c2)"/>`).join('')+text(x+36,y+5,l,{s:14,w:700,mono:true,c:'var(--c2)'})).join('')+
    text(380,244,'x̄ changes from sample to sample',{a:'middle',s:12,c:'var(--muted)'}),
    'The population has one fixed mean mu; each random sample gives a different sample mean');
  /* the means are less spread than the individuals */
  const se=svg(520,250,
    bellArea(20,500,190,70,-3.6,3.6,'var(--c2)',.14)+bell(20,500,190,70,{col:'var(--c2)',w:2.2})+
    bellArea(170,350,190,148,-3.6,3.6,'var(--wk)',.22)+bell(170,350,190,148)+axis(14,506,190)+
    `<line x1="260" x2="260" y1="34" y2="190" stroke="var(--ink)" stroke-dasharray="5 4"/>`+text(260,26,'μ',{a:'middle',s:17,w:800,it:true})+
    text(330,56,'sample means x̄',{s:14,w:700,c:'var(--wk)'})+arrow(260,90,285,90,'var(--wk)',2.2)+text(294,95,'SE',{s:14,w:800,c:'var(--wk)'})+
    text(118,138,'individuals x',{a:'middle',s:14,w:700,c:'var(--c2)'})+arrow(260,176,327,176,'var(--c2)',2.2)+text(334,181,'σ',{s:16,w:800,it:true,c:'var(--c2)'})+
    pill(170,208,180,34,'SE = σ ÷ √n'),'Sample means pile up around mu much more tightly than single values: their spread SE = sigma over root n is smaller than sigma');
  /* skewed population → bell-shaped x̄ */
  const sk=[...Array(81)].map((_,i)=>{ const t=i/10; return [20+t*26,170-118*(t*Math.exp(1-t))]; });
  const clt=svg(520,250,
    `<path d="M20,170 L${sk.map(p=>p.join(',')).join(' L')} L230,170 Z" fill="var(--c2)" fill-opacity=".18"/><path d="M${sk.map(p=>p.join(',')).join(' L')}" fill="none" stroke="var(--c2)" stroke-width="2.6"/>`+axis(14,236,170)+
    text(125,196,'population: any shape',{a:'middle',s:13,w:700})+
    arrow(240,110,290,110,'var(--wk)',2.6)+text(265,98,'n ≥ 30',{a:'middle',s:13,w:800,mono:true,c:'var(--wk)'})+
    bellArea(296,506,170,118,-3.6,3.6,'var(--wk)',.22)+bell(296,506,170,118)+axis(292,510,170)+
    text(401,196,'x̄: approximately normal',{a:'middle',s:13,w:700,c:'var(--wk)'})+
    pill(150,212,220,32,'centre μ · spread σ ÷ √n'),'Whatever the shape of the population, the sample mean of a large sample is approximately normal');
  /* z for x̄ counts steps of SE */
  const Zm=z=>zx(40,480,z), top=z=>170-120*Math.exp(-z*z/2);
  const zm=svg(520,250,
    bellArea(40,480,170,120,-3.6,3.6,'var(--wk)',.14)+bell(40,480,170,120)+axis(30,490,170)+
    `<line x1="${Zm(0)}" x2="${Zm(0)}" y1="50" y2="170" stroke="var(--ink)" stroke-dasharray="5 4"/>`+text(Zm(0),40,'μ',{a:'middle',s:17,w:800,it:true})+
    `<circle cx="${Zm(2)}" cy="170" r="8" fill="var(--c3)"/>`+text(Zm(2),top(2)-14,'x̄',{a:'middle',s:17,w:800,c:'var(--c3)'})+
    [0,1].map(k=>`<rect x="${Zm(k)+1}" y="180" width="${Zm(1)-Zm(0)-2}" height="24" rx="5" fill="var(--wk)" fill-opacity="${k?.55:.8}"/>`+text((Zm(k)+Zm(k+1))/2,197,'SE',{a:'middle',s:13,w:800,c:'var(--surface)'})).join('')+
    text(50,72,'ruler: SE, not σ',{s:14,w:700,c:'var(--wk)'})+
    pill(Zm(0)-120,214,240,32,'z = (x̄ − μ) ÷ SE'),'For a sample mean, z counts how many standard errors x-bar is from mu: here two SE, so z = 2');
  return {vari,se,clt,zm};
})();

Lesson.mount({
  week:10, clo:'CLO 3', title:'Sampling Distribution of the Mean', chapter:'Ch 7: Survey Sampling and Inference · Ch 9: Inferring Population Means · Gould, Ryan & Wong (2020)',
  intro:'We rarely measure a whole population. We take a sample and use its mean. This week: how sample means behave.',
  topics:[
  { id:'variability', title:'Parameters, statistics and sampling variability',
    def:'A <b>parameter</b> describes the population (μ, σ) and is fixed. A <b>statistic</b> comes from a sample (x̄, s) and changes from sample to sample: <b>sampling variability</b>.',
    defFig:{label:'One population, many samples', html:G10.vari},
    life:{text:'All students at a university have a mean commute of μ = 32 min. Five random groups of 36 students each report their mean commute. Data: illustrative.'},
    meaning:{text:'Each sample gives a different x̄, scattered around μ. The distribution of x̄ over all possible samples of size n is the <b>sampling distribution of the mean</b>.', fig:{label:'Five samples, five means', html:meansSVG}} },

  { id:'standard-error', title:'Centre and spread of x̄: the standard error',
    def:'The sample means centre on the population mean: μ<sub>x̄</sub> = μ. Their spread is the <b>standard error</b> SE = σ ÷ √n, smaller than σ.',
    defFig:{label:'Means spread less', html:G10.se},
    life:{text:'Same population: μ = 32 min, σ = 12 min. Samples of n = 36 students.'},
    formula:{f:`${T('se','SE')} = ${fr(T('s','σ'),sq(T('n',v('n'))))}`,
      parts:[['se','<b>SE</b>: the standard error, the SD of the sample means.'],['s','<b>σ</b>: the population SD.'],['n','<b>n</b>: the sample size. Take its square root.']],
      sub:`SE = ${fr('12',sq('36'))}`, keys:'1 2 ÷ √ 3 6 =',
      ans:`<div class="m">SE = 12 ÷ 6 = <b>2</b> min</div>`, ansRaw:true, ansNote:'The sample means centre on 32 min, with SE = 2 min.'},
    meaning:{text:'Bigger samples give means closer to μ. Four times the sample size halves the SE.', fig:{label:'Same population, three sample sizes', html:seSVG}} },

  { id:'clt', demo:'Your professor draws a skewed population and the bell-shaped distribution of x̄ side by side.', title:'The Central Limit Theorem',
    def:'<b>Central Limit Theorem (CLT)</b>: for a large sample (n ≥ 30), x̄ is approximately <b>normal</b> with mean μ and SE = σ ÷ √n, whatever the shape of the population. If the population is normal, this holds for any n.',
    defFig:{label:'Any shape → bell', html:G10.clt},
    life:{text:'Waiting times at a service desk are right-skewed: most people wait a few minutes, a few wait very long. The mean wait of 40 customers still follows a bell curve.'},
    meaning:{text:'Move n from 1 to 50. The histogram of sample means loses its skew and becomes bell-shaped, centred on μ = 10, and narrower as n grows.', fig:{label:'Drag n and watch the shape', build:ST.cltTool, caption:'Simulated means of 800 samples.'}} },

  { id:'z-mean', demo:'Your professor shades the area under the normal curve of x̄ on the board.', title:'Probabilities for a sample mean',
    def:'With the CLT, x̄ is normal, so we use a z-score as in Weeks 8–9, but divide by the <b>standard error</b>, not σ.',
    defFig:{label:'Steps of SE', html:G10.zm},
    life:{text:'Commute times: μ = 32 min, σ = 12 min. A random sample of 36 students. What is the probability that their mean commute is over 35 min?'},
    formula:[{name:'z for x̄', f:`${T('z',v('z'))} = ${fr(T('xb',XB)+' − '+T('mu','μ'),T('se',fr('σ',sq(v('n')))))}`,
      parts:[['z','<b>z</b>: how many SEs x̄ is from μ.'],['xb','<b>x̄</b>: the sample mean in the question.'],['mu','<b>μ</b>: the population mean.'],['se','<b>σ ÷ √n</b>: the standard error.']],
      sub:`${v('z')} = ${fr('35 − 32',fr('12',sq('36')))}`, keys:'( 3 5 − 3 2 ) ÷ ( 1 2 ÷ √ 3 6 ) =',
      ans:`<div class="m">z = 3 ÷ 2 = <b>1.50</b></div>`, ansRaw:true},
     {name:'Greater than', f:`${T('P','P('+XB+' &gt; '+v('a')+')')} = ${T('one','1')} − ${T('phi','Φ('+v('z')+')')}`,
      parts:[['P','<b>P(x̄ &gt; a)</b>: the area to the right of a.'],['one','<b>1</b>: the total area.'],['phi','<b>Φ(z)</b>: the Z-table value, area to the left.']],
      sub:'P(x̄ &gt; 35) = 1 − 0.9332', subNote:'Z-table: P(Z &lt; 1.50) = 0.9332.', keys:'1 − 0 . 9 3 3 2 =',
      ans:`<div class="m">P(x̄ &gt; 35) = <b>0.0668</b></div>`, ansRaw:true, ansNote:'“Greater than” → 1 minus.'}],
    meaning:{text:'Only about 6.7% of samples of 36 have a mean above 35 min. For one student, P(X &gt; 35) = P(Z &gt; 0.25) = 0.4013. Means vary much less than individuals.', fig:{label:'Shaded: mean commute over 35 min', html:ST.normalCurve(32,2,35,1e9,[35])}} }
  ],
  inClass:{intro:'We draw the normal curves and shade the areas together on the board.', items:[
    {q:'Daily screen time of students: μ = 5.2 h, σ = 1.8 h. Random samples of n = 81 students. Find the mean and the SE of x̄. Describe its shape and say why. Find P(x̄ &gt; 5.6). Data: illustrative.', tips:['SE = σ ÷ √n.','n ≥ 30: use the CLT.','Find z, then use the Z-table. “Greater than” → 1 minus.']},
    {q:'A normal population has μ = 60 and σ = 12. Sketch the sampling distribution of x̄ for n = 9 and for n = 36 on the same axis, and mark μ ± 2 SE on each. For n = 36, find P(56 &lt; x̄ &lt; 64).', draw:true, tips:['Same centre, different SE.','The curve with the smaller SE is taller and narrower.','Between two values: subtract the two table values.']}]},
  takeaways:{label:'Week 10 on one page', mindmap:{center:'x̄', branches:[
    {t:'Words',items:['Parameter: μ, σ (fixed)','Statistic: x̄ (varies)','Sampling distribution of x̄']},
    {t:'Centre and spread',items:['Mean of x̄ = μ','SE = σ ÷ √n','Bigger n → smaller SE']},
    {t:'CLT',items:['n ≥ 30 → x̄ approximately normal','Any population shape']},
    {t:'Probability',items:['z = (x̄ − μ) ÷ (σ ÷ √n)','Z-table as in Weeks 8–9']}]}},
  practice:[
    {check:[{l:'SE',v:3}],revise:'SE = σ ÷ √n. Take the square root of n before dividing.',see:{t:'Revise: Centre and spread of x̄: the standard error',href:'#standard-error'},type:'Easy',q:'σ = 15 and n = 25. Find the standard error.',hint:BA.board([gSE(15,25)])},
    {check:[{l:'Mean of x̄',v:70},{l:'SE',v:1}],revise:'The mean of x̄ equals μ. SE = σ ÷ √n.',see:{t:'Revise: Centre and spread of x̄: the standard error',href:'#standard-error'},type:'Easy',q:'A population has μ = 70 and σ = 10. Samples of n = 100. Find the mean and the SE of x̄.',hint:MA({s:[['Mean of x̄','μ<sub>x̄</sub> = μ = <b>70</b>']]},{b:[gSE(10,100)]})},
    {check:[{l:'SE (n = 25)',v:4},{l:'SE (n = 100)',v:2},{l:'The SE…',opts:['Halves','Doubles','Quarters','Stays the same'],v:'Halves'}],revise:'SE = σ ÷ √n. Multiplying n by 4 multiplies √n by 2.',see:{t:'Revise: Centre and spread of x̄: the standard error',href:'#standard-error'},type:'Easy',q:'σ = 20. Find the SE for n = 25 and for n = 100. What happens to the SE?',hint:MA({b:[gSE(20,25,{t:'n = 25'}),gSE(20,100,{t:'n = 100'})]},{s:[['Meaning','Four times the sample size → the SE <b>halves</b> (4 → 2).']]})},
    {check:[{l:'n',v:36}],revise:'From SE = σ ÷ √n: √n = σ ÷ SE, then square to get n.',see:{t:'Revise: Centre and spread of x̄: the standard error',href:'#standard-error'},type:'Medium',q:'σ = 12 and the SE is 2. Find n.',hint:BA.board([{t:'n from SE',lines:[Bd.fr('√n','σ','SE',{n:'σ = 12',d:'SE = 2'}),Bd.line('√n = 12 ÷ 2 = 6'),Bd.line('n = (6)<sup>2</sup> = <b>36</b>','ans')],calc:['(12÷2)²','36']}])},
