<script>
const {W} = Lecture; Lecture.__noLogo=true; const esc = W.esc;
const {T, fr, sq, SG, XB, PH, v} = F;
const goScene = i => { const b=document.querySelectorAll('.toc ol li button')[i]; if(b) b.click(); };
const practice = (items, label) => el => W.practice(el, items, {label: label||'Show answer', prefix: ''});
const FT='font-family="Schibsted Grotesk,Arial"', MONO='font-family="JetBrains Mono,monospace"';
/* practice model answers: formula calculations written on the board (assets/board.js), everything else typed */
const BD=Board, XBd=BA.XB, LCD=BA.lcd, bL=BD.line, bA=h=>BD.line(h,'ans'), bF=BD.frac;
const bX=(pre,top,bot,o={})=>`<div class="bfx">${pre?`<span>${pre}</span>`:''}${bF(o.plain?top:`<span class="g">${top}</span>`,o.plain?bot:`<span class="r">${bot}</span>`)}${o.after?`<span>${o.after}</span>`:''}${o.n||o.d?`<span class="bnote"><span class="g">${o.n?'⟶ '+o.n:''}</span><span class="r">${o.d?'⟶ '+o.d:''}</span></span>`:''}</div>`;
/* long calculator entries with no + to break on: wrap them on × ÷ − so the whole entry stays on the screen */
const bWrap=e=>{ const tk=e.split(/(?<=\+)/).flatMap(s=>s.length>21?s.split(/(?<=[×÷−])/):[s]), out=[]; let c='';
  tk.forEach(t=>{ if((c+t).length>21&&c){ out.push(c); c=t; } else c+=t; }); if(c) out.push(c); return out; };
let bK=0;
const bMake=gs=>{ const rep=[]; const g2=gs.map(g=>{ if(!g.calc||!g.calc[0].split(/(?<=\+)/).some(s=>s.length>22)) return g;
    const ch=bWrap(g.calc[0]), id=bK++, ph=ch.map((c,i)=>`Q${id}Z${i}`.padEnd(21,'Z')); rep.push([ph,ch,g.calc[0],ph.join('+')]); return Object.assign({},g,{calc:[ph.join('+'),g.calc[1]]}); });
  let h=BD.make(g2); rep.forEach(([ph,ch,real,fake])=>{ h=h.replace(`Calculator: ${fake} =`,`Calculator: ${real} =`); ph.forEach((p,i)=>{ h=h.replace(p+(i<ph.length-1?'+':''),ch[i]); }); }); return h; };
const bT=BA.steps, bM=(...ps)=>ps.map(p=>Array.isArray(p)?bMake(p):p).join('')+`<p class="bd-foot">${BA.HOW}</p>`;
/* sums table and r from the sums, written like the board */
const gSums=(x,y,o={})=>{ const c=[['x',x],['y',y],['xy',x.map((v,i)=>v*y[i])],['x²',x.map(v=>v*v)]].concat(o.y2===false?[]:[['y²',y.map(v=>v*v)]]);
  return {t:'Sums table',lines:[BD.tb([''].concat(c.map(k=>k[0])),x.map((_,i)=>[''].concat(c.map(k=>String(k[1][i])))),['Σ'].concat(c.map(k=>String(k[1].reduce((a,b)=>a+b,0)))))]}; };
const gR=(n,Sx,Sy,Sxy,Sx2,Sy2,o={})=>{ const top=n*Sxy-Sx*Sy, bx=n*Sx2-Sx*Sx, by=n*Sy2-Sy*Sy, r=top/Math.sqrt(bx*by);
  return {t:o.t||'Correlation (r)',lines:[bX('r =','nΣxy − ΣxΣy','√[(nΣx² − (Σx)²) ×<br>(nΣy² − (Σy)²)]')]
    .concat(o.dec?[bL(`<span class="g">n = ${n}, Σx = ${Sx}, Σy = ${Sy}, Σxy = ${Sxy}</span>`),bL(`<span class="r">Σx² = ${Sx2}, Σy² = ${Sy2}</span>`)]:[])
    .concat([bL(`<span class="g">top</span> = ${n}(${Sxy}) − ${Sx}(${Sy}) = ${BA.num(top)}`),bL(`<span class="r">x part</span> = ${n}(${Sx2}) − ${Sx}² = ${bx}`),bL(`<span class="r">y part</span> = ${n}(${Sy2}) − ${Sy}² = ${by}`),
      bA(`r = ${bF(BA.num(top),`√(${bx} × ${by})`)} ${o.eq||'≈'} <b>${o.ans}</b>`)]),
    calc:[`(${n}×${Sxy}−${Sx}×${Sy})÷√((${n}×${Sx2}−${Sx}²)×(${n}×${Sy2}−${Sy}²))`,LCD(r)]}; };
/* scatterplot: points, optional fitted line ŷ = a + bx, optional residual segments, extra marks */
function scat(o){
  const Wd=o.w||480,Hd=o.h||270,L=48,R=14,Tp=14,B=42,[x0,x1]=o.xr,[y0,y1]=o.yr;
  const X=v=>L+(Wd-L-R)*(v-x0)/(x1-x0), Y=v=>Tp+(Hd-Tp-B)*(1-(v-y0)/(y1-y0));
  let s=`<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="${o.label||'Scatterplot'}">`;
  (o.yt||[]).forEach(t=>{ s+=`<line x1="${L}" x2="${Wd-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" ${MONO} font-size="11" fill="var(--muted)">${t}</text>`; });
  (o.xt||[]).forEach(t=>{ s+=`<text x="${X(t)}" y="${Hd-B+16}" text-anchor="middle" ${MONO} font-size="11" fill="var(--muted)">${t}</text>`; });
  s+=`<line x1="${L}" x2="${L}" y1="${Tp}" y2="${Hd-B}" stroke="var(--ink)"/><line x1="${L}" x2="${Wd-R}" y1="${Hd-B}" y2="${Hd-B}" stroke="var(--ink)"/>`;
  s+=`<text x="${(L+Wd-R)/2}" y="${Hd-6}" text-anchor="middle" ${FT} font-size="12" fill="var(--ink)">${o.xl}</text><text transform="translate(13 ${(Tp+Hd-B)/2}) rotate(-90)" text-anchor="middle" ${FT} font-size="12" fill="var(--ink)">${o.yl}</text>`;
  if(o.line){ const [a,b]=o.line, lx=o.lx||[x0,x1];
    if(o.resid) o.x.forEach((x,i)=>{ s+=`<line x1="${X(x)}" x2="${X(x)}" y1="${Y(o.y[i])}" y2="${Y(a+b*x)}" stroke="var(--c3)" stroke-width="2" stroke-dasharray="4 3"/>`; });
    s+=`<line x1="${X(lx[0])}" y1="${Y(a+b*lx[0])}" x2="${X(lx[1])}" y2="${Y(a+b*lx[1])}" stroke="var(--wk)" stroke-width="2.4"/>`; }
  if(o.extra) s+=o.extra(X,Y);
  o.x.forEach((x,i)=>{ s+=`<circle cx="${X(x)}" cy="${Y(o.y[i])}" r="5.5" fill="var(--c2)" stroke="var(--surface)" stroke-width="1.5"/>`; });
  return s+'</svg>';
}
const tbl=(h,rows,foot)=>`<div class="tblwrap"><table class="tbl"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}${foot?`<tr>${foot.map(x=>`<th>${x}</th>`).join('')}</tr>`:''}</table></div>`;
const MG=a=>`<div class="mg">${a.map(([l,t])=>l==='Calculator'?`<div><span>Calculator</span>${F.keys(t)}</div>`:`<div${l==='Answer'?' class="fin"':''}><span>${l}</span><span>${t}</span></div>`).join('')}</div>`;

/* phone use (h/day) and sleep (h/night): Data: illustrative */
const PX=[2,3,4,5,6], PY=[8,8,7,6,5];
const phone=o=>scat(Object.assign({x:PX,y:PY,xr:[0,7],yr:[4,11],xt:[0,1,2,3,4,5,6,7],yt:[4,5,6,7,8,9,10,11],xl:'Phone use (hours per day)',yl:'Sleep (hours)',label:'Scatterplot of phone use and sleep'},o||{}));

const pats=(()=>{ let seed=5; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const plot=(x0,lab,f)=>{ let s=`<g transform="translate(${x0},10)"><rect width="150" height="130" rx="10" fill="var(--bg)" stroke="var(--line)"/>`; for(let i=0;i<18;i++){ const x=10+rnd()*130, y=f(x); s+=`<circle cx="${x}" cy="${Math.max(8,Math.min(122,y))}" r="4" fill="var(--wk)"/>`; } return s+`<text x="75" y="152" text-anchor="middle" ${FT} font-weight="700" font-size="13" fill="var(--ink)">${lab}</text></g>`; };
  return `<svg viewBox="0 0 520 170" role="img" aria-label="Positive, negative and no relationship">${plot(10,'Positive',x=>120-x*.8+(rnd()-.5)*30)}${plot(185,'Negative',x=>15+x*.8+(rnd()-.5)*30)}${plot(360,'No relationship',()=>10+rnd()*110)}</svg>`; })();

const SCALE=`<svg viewBox="0 0 520 96" role="img" aria-label="Strength of r from −1 to +1"><defs><linearGradient id="rg13" x1="0" x2="1"><stop offset="0" stop-color="var(--c2)"/><stop offset=".5" stop-color="var(--line)"/><stop offset="1" stop-color="var(--wk)"/></linearGradient></defs><rect x="20" y="34" width="480" height="12" rx="6" fill="url(#rg13)"/>${[[-1,'−1'],[-.7,'−0.7'],[-.4,'−0.4'],[0,'0'],[.4,'0.4'],[.7,'0.7'],[1,'+1']].map(([r,t])=>`<text x="${260+240*r}" y="26" text-anchor="middle" ${MONO} font-size="11" fill="var(--ink)">${t}</text>`).join('')}${[[-.85,'strong −'],[-.55,'moderate −'],[-.2,'weak −'],[.2,'weak +'],[.55,'moderate +'],[.85,'strong +']].map(([r,t])=>`<text x="${260+240*r}" y="66" text-anchor="middle" ${FT} font-size="11" fill="var(--muted)">${t}</text>`).join('')}<path d="M${260-240*.970} 50 l-6 10 h12 z" fill="var(--ink)"/><text x="${260-240*.970+10}" y="88" ${MONO} font-size="11" font-weight="600" fill="var(--ink)">r = −0.970</text></svg>`;

/* choose r: points built so that their correlation is exactly r */
function rTool(el){
  const RS=[-0.9,-0.5,0,0.5,0.9];
  el.innerHTML=`<div class="tool"><div class="seg2">${RS.map((r,i)=>`<button type="button" aria-pressed="${i===4}">r = ${r}</button>`).join('')}</div><div class="pic"></div><div class="feedback"></div></div>`;
  let seed=11; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const n=24, xs=[...Array(n)].map(()=>rnd()), zs=[...Array(n)].map(()=>rnd()+rnd()+rnd());
  const std=a=>{ const m=a.reduce((s,v)=>s+v,0)/a.length, sd=Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length); return a.map(v=>(v-m)/sd); };
  const zx=std(xs), z0=std(zs), c=zx.reduce((s,v,i)=>s+v*z0[i],0)/n, zn=std(z0.map((v,i)=>v-c*zx[i]));
  const word=r=>r===0?'no linear relationship':(Math.abs(r)>=.7?'strong ':Math.abs(r)>=.4?'moderate ':'weak ')+(r>0?'positive':'negative');
  const draw=r=>{ const y=zx.map((v,i)=>r*v+Math.sqrt(1-r*r)*zn[i]);
    el.querySelector('.pic').innerHTML=scat({x:zx,y,xr:[-2.6,2.6],yr:[-3,3],xl:'x',yl:'y',w:420,h:240,label:'Scatterplot with r = '+r});
    el.querySelector('.feedback').innerHTML=`r = <b>${r}</b>: ${word(r)}.`; };
  el.querySelectorAll('.seg2 button').forEach((b,i)=>b.addEventListener('click',()=>{ el.querySelectorAll('.seg2 button').forEach(x=>x.setAttribute('aria-pressed',x===b)); draw(RS[i]); }));
  draw(0.9);
}

const RED='#C62828';
const G13=(()=>{ const {svg,card,text,arrow,curveArrow,pill}=CG;

  /* scatterplot: one pair (x, y) becomes one point */
  const sp=svg(520,250,
    card(16,62,190,124)+text(111,92,'ONE INDIVIDUAL',{a:'middle',s:12,w:700,mono:true,c:'var(--wk)'})+text(111,132,'(x, y)',{a:'middle',s:30,w:800,mono:true})+text(111,164,'one pair of values',{a:'middle',s:13,c:'var(--muted)'})+
    arrow(214,124,262,124,'var(--wk)',2.4)+
    ax(286,206,504,22)+[[318,170],[340,150],[356,166],[420,96],[446,80],[466,104],[398,140]].map(([x,y])=>dot(x,y,'var(--c2)',4.5)).join('')+
    `<line x1="380" x2="380" y1="112" y2="206" stroke="var(--wk)" stroke-dasharray="5 4" stroke-width="1.6"/><line x1="286" x2="380" y1="112" y2="112" stroke="var(--wk)" stroke-dasharray="5 4" stroke-width="1.6"/>`+dot(380,112,'var(--wk)',8)+
    text(380,224,'x',{a:'middle',s:15,w:800,c:'var(--wk)',mono:true})+text(276,117,'y',{a:'end',s:15,w:800,c:'var(--wk)',mono:true})+
    text(504,244,'x: explanatory →',{a:'end',s:12,c:'var(--muted)'})+text(296,24,'y: response',{s:12,c:'var(--muted)'}),

  const L7=[...Array(7)].map((_,i)=>14+i*16), cloud=[[20,30],[34,82],[46,52],[58,96],[64,22],[78,70],[90,40],[100,90],[106,58],[30,60],[86,18]];
  const r=svg(520,250,
    pill(170,6,180,32,'−1 ≤ r ≤ +1')+
    pnl(80,L7.map((x,i)=>[x,14+i*14]),RED)+pnl(260,cloud,'var(--muted)')+pnl(440,L7.map((x,i)=>[x,98-i*14]),'var(--wk)')+
    `<line x1="30" x2="490" y1="186" y2="186" stroke="var(--ink)" stroke-width="1.5"/>`+[80,260,440].map(x=>`<line x1="${x}" x2="${x}" y1="180" y2="192" stroke="var(--ink)" stroke-width="1.5"/>`).join('')+
    text(80,212,'−1',{a:'middle',s:16,w:800,mono:true,c:RED})+text(260,212,'0',{a:'middle',s:16,w:800,mono:true})+text(440,212,'+1',{a:'middle',s:16,w:800,mono:true,c:'var(--wk)'})+
    text(80,234,'all on a line',{a:'middle',s:12,c:'var(--muted)'})+text(260,234,'no straight line',{a:'middle',s:12,c:'var(--muted)'})+text(440,234,'all on a line',{a:'middle',s:12,c:'var(--muted)'}),
    'r runs from −1 to +1: at −1 or +1 every point is on a straight line; at 0 there is no straight-line pattern');
  /* reading r: ignore the sign for the strength */
  const tight=(x0,up)=>[0,1,2,3,4,5,6].map(i=>dot(x0+16+i*17,up?102-i*13+(i%2?6:-5):24+i*13+(i%2?-5:6),'var(--c2)',4.5)).join('');
  const Z=v=>40+440*v;
  const str=svg(520,250,
    `<rect x="170" y="10" width="130" height="112" rx="10" fill="var(--c2)" fill-opacity=".07" stroke="var(--c2)" stroke-opacity=".45"/>`+tight(170,false)+text(235,142,'r = −0.9',{a:'middle',s:14,w:800,mono:true})+
    `<rect x="330" y="10" width="130" height="112" rx="10" fill="var(--c2)" fill-opacity=".07" stroke="var(--c2)" stroke-opacity=".45"/>`+tight(330,true)+text(395,142,'r = +0.9',{a:'middle',s:14,w:800,mono:true})+
    arrow(262,150,Z(.88)-12,166,'var(--wk)',2.2)+arrow(400,150,Z(.88)+2,166,'var(--wk)',2.2)+
    `<rect x="${Z(0)}" y="170" width="${Z(.4)-Z(0)}" height="30" fill="var(--muted)" fill-opacity=".18"/><rect x="${Z(.4)}" y="170" width="${Z(.7)-Z(.4)}" height="30" fill="var(--c2)" fill-opacity=".22"/><rect x="${Z(.7)}" y="170" width="${Z(1)-Z(.7)}" height="30" fill="var(--wk)" fill-opacity=".3"/>`+
    text(Z(.2),190,'weak',{a:'middle',s:13,w:700})+text(Z(.55),190,'moderate',{a:'middle',s:13,w:700})+text(Z(.85),190,'strong',{a:'middle',s:13,w:800,c:'var(--wk)'})+
    [0,.4,.7,1].map(v=>text(Z(v),218,String(v),{a:'middle',s:12,mono:true})).join('')+
    text(260,242,'size of r, ignoring the sign',{a:'middle',s:12,c:'var(--muted)'}),
    'r = −0.9 and r = +0.9 are equally strong: ignore the sign, then 0.7 to 1 is strong, 0.4 to 0.7 moderate, below 0.4 weak');
  /* the line ŷ = a + bx: intercept and one rise/run step */
  const yl=x=>170-(x-60)*0.3;
  const line=svg(520,250,
    ax(60,210,496,16)+`<line x1="60" x2="486" y1="${yl(60)}" y2="${yl(486)}" stroke="var(--wk)" stroke-width="3"/>`+
    `<path d="M230,${yl(230)} L350,${yl(230)} L350,${yl(350)}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 4"/>`+

    dot(60,yl(60),'var(--wk)',7)+text(46,yl(60)+7,'a',{a:'end',s:20,w:800,it:true,c:'var(--wk)'})+text(72,yl(60)+28,'ŷ at x = 0',{s:12,c:'var(--muted)'})+
    text(496,232,'x',{a:'end',s:14,w:700,mono:true})+text(48,24,'ŷ',{a:'end',s:14,w:700,mono:true})+
    pill(86,20,180,36,'ŷ = a + bx'),
    'The line starts at a when x = 0 and rises b for every 1 step to the right');
  return {sp,r,str,line};
})();

  { id:'reading-r', title:'Reading r: direction and strength',

    meaning:{text:'r has no units and stays the same if x and y are swapped. r = −0.9 is as strong as r = 0.9; only the direction differs.'} },

    formula:{f:`${T('b',v('b'))} = ${fr(T('dy','change in '+v('ŷ')),T('dx','change in '+v('x')))} = ${fr(T('dy',v('ŷ')+'<sub>2</sub> − '+v('ŷ')+'<sub>1</sub>'),T('dx',v('x')+'<sub>2</sub> − '+v('x')+'<sub>1</sub>'))}`,
