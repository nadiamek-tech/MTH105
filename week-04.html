<script>
const {W} = Lecture; Lecture.__noLogo=true; const esc = W.esc;
const {T, fr, sq, SG, XB, PH, v} = F;
const goScene = i => { const b=document.querySelectorAll('.toc ol li button')[i]; if(b) b.click(); };
const practice = (items, label) => el => W.practice(el, items, {label: label||'Show answer', prefix: ''});
const FT='font-family="Schibsted Grotesk,Arial"', MONO='font-family="JetBrains Mono,monospace"';
/* practice board answers: the calculator result is computed from the typed entry, so board and calculator always agree */
const BB=Board, KC=e=>[e,BA.lcd(Function('return '+e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/√\(/g,'Math.sqrt(').replace(/²/g,'**2'))())];
const W2='<a href="https://nadiamek-tech.github.io/MindTheGap/workshop-02.html" target="_blank" rel="noopener">Every symbol, step by step: Mind the Gap Workshop 2 ↗</a>';

Lesson.mount({
  week:4, clo:'CLO 1', title:'Measures of Dispersion', chapter:'Ch.3: Numerical Summaries of Center and Variation · Gould, Ryan & Wong (2020)',
  intro:'The same mean can hide very different spreads. This week: one number for the spread.',
  topics:[
  { id:'range-iqr', demo:'Your professor draws a boxplot on the board, with fences and outliers.', title:'Range, IQR and the boxplot',
    def:'The <b>range</b> is max − min. The <b>IQR</b> (interquartile range) is Q3 − Q1: the spread of the middle 50%.',
    life:{text:'Two bus routes both average 30 minutes. On one, trips take 28–32 min; on the other, 15–60 min. Same mean, very different reliability. Data: illustrative.'},
    formula:{f:`${T('iqr','IQR')} = ${T('q3','Q3')} − ${T('q1','Q1')}`,
      parts:[['iqr','<b>IQR</b>: spread of the middle half of the data.'],['q3','<b>Q3</b>: the 75th percentile (median of the upper half).'],['q1','<b>Q1</b>: the 25th percentile (median of the lower half).']],
      sub:'IQR = 26.5 − 16', subNote:'Data: 12, 15, 17, 18, 20, 22, 25, 28, 31. Q1 = (15 + 17) ÷ 2 = 16, Q3 = (25 + 28) ÷ 2 = 26.5.', keys:'2 6 . 5 − 1 6 =',
      ans:`<div class="m">IQR = <b>10.5</b></div><p class="calcnote">Range = 31 − 12 = 19.</p>`, ansRaw:true, ansNote:'Outliers: below Q1 − 1.5·IQR or above Q3 + 1.5·IQR.'},
    meaning:{text:'The boxplot draws the five-number summary: min, Q1, median, Q3, max. A long whisker or a dot beyond the fences shows skew or outliers.', fig:{label:'Type data, see the boxplot', build:ST.boxTool}} },

  { id:'variance', demo:'Your professor builds a deviation table on the board.', title:'Sample variance',
    def:'The <b>variance</b> s² is the average squared distance from the mean. For a sample, divide by n − 1.',
    life:{text:'Five students’ quiz scores: 4, 6, 7, 9, 14. Mean = 8. How far are they from 8, on average?'},
    formula:{f:`${T('s2',v('s')+'<sup>2</sup>')} = ${fr(`${T('S',SG)}${T('d','('+v('x')+' − '+XB+')<sup>2</sup>')}`,T('n1',v('n')+' − 1'))}`,
      parts:[['s2','<b>s²</b>: the sample variance (squared units).'],['S','<b>Σ</b>: add up.'],['d','<b>(x − x̄)²</b>: distance from the mean, squared. Subtract first, then square.'],['n1','<b>n − 1</b>: one less than the sample size.']],
      sub:`${v('s')}<sup>2</sup> = ${fr('(−4)² + (−2)² + (−1)² + 1² + 6²','5 − 1')}`, subNote:'Data: 4, 6, 7, 9, 14. Mean = 8.',
      keys:'( ( 4 − 8 ) x² + ( 6 − 8 ) x² + ( 7 − 8 ) x² + ( 9 − 8 ) x² + ( 1 4 − 8 ) x² ) ÷ ( 5 − 1 ) =', ans:`<div class="m">s² = 58 ÷ 4 = <b>14.5</b></div>`, ansRaw:true, ansNote:'Population variance σ² divides by N instead of n − 1.'},
    meaning:{text:'Variance is in squared units (points²), so it is hard to read. That is why we take its square root next.'} },

  { id:'sd', title:'Standard deviation',
    def:'The <b>standard deviation</b> s is the square root of the variance: the typical distance from the mean, in the original units.',
    life:{text:'Same quiz scores: s² = 14.5 points².'},
    formula:{f:`${T('s',v('s'))} = ${sq(T('s2',v('s')+'<sup>2</sup>'))}`,
      parts:[['s','<b>s</b>: the sample standard deviation.'],['s2','<b>s²</b>: the variance you just found.']],
      sub:`${v('s')} = ${sq('14.5')}`, keys:'√ 1 4 . 5 =', ans:`<div class="m">s ≈ <b>3.81</b> points</div>`, ansRaw:true, ansNote:'Report it with the mean: 8 ± 3.81.'},
    meaning:{text:'A typical score is about 3.8 points from the mean of 8. Larger s = more spread. Check any data set step by step with the deviation table.', fig:{label:'Deviation table', build:el=>ST.spreadTool(el)}} },

  { id:'cv', title:'Coefficient of variation',
    def:'The <b>coefficient of variation</b> (CV) is the standard deviation as a percentage of the mean.',
    life:{text:'City A temperature: mean 15 °C, s 6 °C. City B rainfall: mean 100 mm, s 30 mm. Different units: which varies more? Data: illustrative.'},
    formula:{f:`${T('cv','CV')} = ${fr(T('s',v('s')),T('xb',XB))} × 100%`,
      parts:[['cv','<b>CV</b>: relative spread, in %.'],['s','<b>s</b>: standard deviation.'],['xb','<b>x̄</b>: mean.']],
      sub:`CV<sub>temp</sub> = ${fr('6','15')} × 100%<br>CV<sub>rain</sub> = ${fr('30','100')} × 100%`, keys:'6 ÷ 1 5 × 1 0 0 =',
      ans:`<div class="m">40% vs 30%</div>`, ansRaw:true},
    meaning:{text:'CV has no units, so it compares spread across different means or units. Smaller CV = more consistent. Here temperature varies more, relative to its mean.'} }
  ],
  inClass:{intro:'Your professor draws the boxplot on the board. Draw it with them, then compute the spread.', items:[
    {q:'Data: 8, 11, 12, 14, 15, 17, 18, 20, 21, 35. Find the five-number summary, the IQR and the outlier fences, then draw the boxplot.', draw:true, tips:['Five numbers: min, Q1, median, Q3, max.','Fences: Q1 − 1.5 × IQR and Q3 + 1.5 × IQR.','A value beyond a fence is drawn as a dot; the whisker stops at the last value inside.']},
    {q:'Data: 3, 5, 7, 9, 11. Build the deviation table and find s², s and the CV.', tips:['Find the mean first.','Columns: x, x − x̄, (x − x̄)².','Divide the total of the squares by n − 1.']}]},
  takeaways:{label:'Week 4 on one page', mindmap:{center:'Week 4', branches:[
    {t:'Range and IQR',items:['Range = max − min','IQR = Q3 − Q1','Fences: Q1 − 1.5·IQR, Q3 + 1.5·IQR']},
    {t:'Variance',items:['s² = Σ(x − x̄)² ÷ (n − 1)','Subtract, square, add, divide']},
    {t:'SD',items:['s = √s²','Same units as the data']},
    {t:'CV',items:['CV = s ÷ x̄ × 100%','Smaller CV = more consistent']}]}},
  practice:[
    {check:[{l:'Range',v:13}],revise:'Range = max − min. Find the largest and smallest values: they are not the first and last in the list.',see:{t:'Revise: Range, IQR and the boxplot',href:'#range-iqr'},type:'Easy',q:'Find the range of 4, 9, 2, 15, 7.',hint:BA.board([{lines:[BB.line('Range = max − min'),BB.dec([['max','15'],['min','2']]),BB.line('Range = 15 − 2 = <b>13</b>','ans')],calc:KC('15−2')}])},
    {check:[{l:'Var',v:4},{l:'SD',v:2}],revise:'Var: s² = Σ(x − x̄)² ÷ (n − 1), each (x − x̄)² in brackets; SD = √Var. Divide by n − 1, not n.',see:{t:'Revise: Sample variance',href:'#variance'},type:'Easy',q:'Find s² and s for 2, 4, 6.',hint:BA.board([BA.mean([2,4,6],{t:'Mean first'}),BA.var([2,4,6],{t:'Variance (Var)'}),BA.sd(4,{t:'Standard deviation (SD)'})])},
    {check:[{l:'CV',v:10,u:'%',pct:true}],revise:'CV = SD ÷ x̄ × 100%. SD goes on top, the mean underneath.',see:{t:'Revise: Coefficient of variation',href:'#cv'},type:'Easy',q:'Mean = 50, s = 5. Find the CV.',hint:BA.board([BA.cv(5,50)])},
    {check:[{l:'IQR',v:2.8},{l:'Upper fence',v:12.1},{l:'Outlier?',opts:['Yes','No'],v:'Yes'}],revise:'IQR = Q3 − Q1; upper fence = Q3 + (1.5 × IQR). Multiply 1.5 × IQR before adding Q3.',see:{t:'Revise: Range, IQR and the boxplot',href:'#range-iqr'},type:'Medium',q:'Daily steps (thousands): 3.2, 4.5, 5.1, 5.8, 6.0, 6.4, 7.2, 7.9, 8.3, 14.6. Q1 = 5.1, Q3 = 7.9. Is 14.6 an outlier?',hint:BA.board([{t:'IQR',lines:[BB.line('IQR = Q3 − Q1'),BB.dec([['Q3','7.9'],['Q1','5.1']]),BB.line('IQR = 7.9 − 5.1 = <b>2.8</b>','ans')],calc:KC('7.9−5.1')},{t:'Upper fence',lines:[BB.line('Upper fence = Q3 + 1.5 × IQR'),BB.line('= 7.9 + (1.5 × 2.8) = <b>12.1</b>','ans')],calc:KC('7.9+(1.5×2.8)')},{lines:[BB.line('14.6 &gt; 12.1 ⟶ <b>yes, outlier</b>','ans')]}])},
    {check:[{l:'Var',v:62.5},{l:'SD',v:7.9057},{l:'CV',v:15.811,u:'%',pct:true,tol:0.06}],revise:'Find x̄ first, then Var = Σ(x − x̄)² ÷ (n − 1) with each bracket squared; SD = √Var. Use SD, not Var, in the CV.',see:{t:'Revise: Sample variance',href:'#variance'},type:'Medium',q:'Water used per shower (L) by 5 students: 40, 45, 50, 55, 60. Find s², s and CV.',hint:BA.board([BA.mean([40,45,50,55,60],{t:'Mean first'}),BA.var([40,45,50,55,60],{t:'Variance (Var)'}),BA.sd(62.5,{t:'Standard deviation (SD)'}),BA.cv(Math.sqrt(62.5),50,{t:'Coefficient of variation (CV)',entry:'√(62.5)'})])},
    {check:[{l:'CV of A',v:7.5,u:'%',pct:true},{l:'CV of B',v:11.111,u:'%',pct:true,tol:0.06},{l:'More consistent',opts:['Plant A','Plant B'],v:'Plant A'}],revise:'CV = SD ÷ x̄ × 100% compares spread when the means differ. The smaller CV is more consistent, not the smaller SD.',see:{t:'Revise: Coefficient of variation',href:'#cv'},type:'Medium',q:'Two desalination plants. A: mean 120 ML/day, s = 9. B: mean 45 ML/day, s = 5. Which is more consistent?',hint:BA.board([BA.cv(9,120,{t:'Plant A',lhs:'CV<sub>A</sub>'}),BA.cv(5,45,{t:'Plant B',lhs:'CV<sub>B</sub>'}),{lines:[BB.line('Smaller CV = more consistent ⟶ <b>Plant A</b>','ans')]}])},
    {check:[{l:'Range',v:5},{l:'IQR',v:3.5},{l:'Var',v:4},{l:'SD',v:2},{l:'CV',v:8.333,u:'%',pct:true,tol:0.04}],revise:'Sort the data for Q1 and Q3. Var = Σ(x − x̄)² ÷ (n − 1): divide by n − 1, not n; then SD = √Var and CV = SD ÷ x̄ × 100%.',see:{t:'Revise: Sample variance',href:'#variance'},type:'Hard',q:'Temperatures (°C): 21, 23, 25, 25, 26. Find the range, IQR, s², s and CV.',hint:BA.steps([['Range','26 − 21 = <b>5</b>'],['IQR','Median 25. Halves 21, 23 and 25, 26 → Q1 = 22, Q3 = 25.5 → IQR = <b>3.5</b>']])+BA.board([BA.mean([21,23,25,25,26],{t:'Mean first'}),BA.var([21,23,25,25,26],{t:'Variance (Var)'}),BA.sd(4,{t:'Standard deviation (SD)'}),BA.cv(2,24,{t:'Coefficient of variation (CV)'})])}],
  next:'Next: Week 5, Ch 5 Modeling Variation with Probability. <a href="week-05.html">Open Week 5 →</a>'
});
</script>
