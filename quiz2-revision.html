const {W} = Lecture; Lecture.__noLogo=true; const esc = W.esc;
const {T, fr, sq, SG, XB, PH, v} = F;
const goScene = i => { const b=document.querySelectorAll('.toc ol li button')[i]; if(b) b.click(); };
const practice = (items, label) => el => W.practice(el, items, {label: label||'Show answer', prefix: ''});
const FT='font-family="Schibsted Grotesk,Arial"', MONO='font-family="JetBrains Mono,monospace"';
const HOW='Method: as covered in class.';
/* Mind the Gap model answer: rule → formula → decode → substitute → calculator → answer */
const MG=o=>`<div class="mg">${o.r?`<div><span>Which rule</span><span>${o.r}</span></div>`:''}${o.f?`<div><span>Formula</span><span>${o.f}</span></div>`:''}${o.d?`<div><span>Decode</span><span>${o.d}</span></div>`:''}${o.s?`<div><span>Substitute</span><span>${o.s}</span></div>`:''}${o.k?`<div><span>Calculator</span>${F.keys(o.k)}</div>`:''}<div class="fin"><span>Answer</span><span>${o.a}</span></div>${o.how===false?'':`<div class="how"><span>${HOW}</span></div>`}</div>`;
const steps=a=>`<div class="mg">${a.map(([l,t])=>`<div${l==='Answer'?' class="fin"':''}><span>${l}</span><span>${t}</span></div>`).join('')}<div class="how"><span>${HOW}</span></div></div>`;
const tbl=(h,rows)=>`<table class="tbl" style="margin:6px 0"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
function bars(vals,labels,xl){ const Wd=440,Hd=170,bw=(Wd-60)/vals.length; return `<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Bar chart">${[0,2,4,6,8].map(g=>`<line x1="34" x2="${Wd-10}" y1="${140-g*14}" y2="${140-g*14}" stroke="var(--line)"/><text x="28" y="${144-g*14}" text-anchor="end" ${MONO} font-size="10" fill="var(--muted)">${g}</text>`).join('')}${vals.map((v,i)=>`<rect x="${44+i*bw+bw*.2}" y="${140-v*14}" width="${bw*.6}" height="${v*14}" fill="var(--wk)" opacity=".75"/><text x="${44+i*bw+bw/2}" y="156" text-anchor="middle" ${MONO} font-size="11" fill="var(--ink)">${labels[i]}</text>`).join('')}<line x1="34" x2="${Wd-10}" y1="140" y2="140" stroke="var(--ink)"/><text x="${Wd/2}" y="${Hd-1}" text-anchor="middle" ${FT} font-size="11" fill="var(--muted)">${xl}</text></svg>`; }
function ogive(b,c,xl){ const Wd=440,Hd=190,L=34,R=12,T=10,B=34,n=c[c.length-1],X=i=>L+(Wd-L-R)*i/(b.length-1),Y=v=>T+(Hd-T-B)*(1-v/n); return `<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Ogive">${[0,10,20,30,40].map(g=>`<line x1="${L}" x2="${Wd-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(g)+4}" text-anchor="end" ${MONO} font-size="10" fill="var(--muted)">${g}</text>`).join('')}<polyline points="${c.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="var(--c3)" stroke-width="2.4"/>${c.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="var(--c3)"/><text x="${X(i)}" y="${Y(v)-8}" text-anchor="middle" ${MONO} font-size="10" fill="var(--ink)">${v}</text><text x="${X(i)}" y="${Hd-B+16}" text-anchor="middle" ${MONO} font-size="10" fill="var(--muted)">${b[i]}</text>`).join('')}<text x="${(L+Wd-R)/2}" y="${Hd-3}" text-anchor="middle" ${FT} font-size="11" fill="var(--muted)">${xl}</text></svg>`; }

const r2=x=>num(Math.round(x*100)/100), r1=x=>num(Math.round(x*10)/10);
const sum=a=>a.reduce((s,x)=>s+x,0);

/* ---------- formula + method cards (only what is needed) ---------- */
/* ---------- formula card + "how to solve" as tiny steps: one action each, with a worked example ---------- */
const bell=(m)=>{const P=[];for(let i=0;i<=40;i++){const x=-3+i*0.15;P.push([10+i*2,34-26*Math.exp(-x*x/2)]);}
  const inR=x=>m==='l'?x<=50:m==='r'?x>=50:(x>=24&&x<=56);
  const sh=P.filter(([x])=>inR(x)), d='M'+P.map(q=>q.join(',')).join(' L');
  const a=sh.length?`M${sh[0][0]},34 L`+sh.map(q=>q.join(',')).join(' L')+` L${sh[sh.length-1][0]},34 Z`:'';
  return `<svg viewBox="0 0 100 38" width="78" height="30" aria-hidden="true"><path d="${a}" fill="var(--wk)" opacity=".35"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="8" y1="34" x2="92" y2="34" stroke="currentColor" stroke-width="1"/></svg>`;};
const FORM=rows=>`<table class="tbl"><tr><th>What</th><th>Formula</th></tr>${rows.map(([a,b])=>`<tr><td>${a}</td><td class="mono">${b}</td></tr>`).join('')}</table>`;
const FLOW=(eg,st)=>`<div class="flow"><div class="flow-h">How to solve <span>· example: ${eg}</span></div><ol>${st.map(([a,e])=>`<li><b>${a}</b><span class="eg">${e}</span></li>`).join('')}</ol></div>`;
const PICK=(t,c)=>`<div class="pick"><div class="flow-h">${t}</div><div class="pick-g">${c.map(([v,k,r])=>`<div>${v}<b>${k}</b><span>${r}</span></div>`).join('')}</div></div>`;

/* ---------------- Part 1 · Binomial ---------------- */
const BIN_LEAD=FORM([['Exactly x','nCx · p<sup>x</sup> · q<sup>n − x</sup>'],['Mean','μ = n · p'],['SD','σ = √(n · p · q)']])
 +FLOW('n = 5, p = 0.3, find P(X = 2)',[['Write n, p, q, x','n = 5 · p = 0.3 · q = 0.7 · x = 2'],['Put in the formula','5C2 × 0.3<sup>2</sup> × 0.7<sup>3</sup>'],['Calculator','= 0.3087']])
 +PICK('Which one?',[['','Exactly','one formula'],['','At least 1','1 − P(0)'],['','At most 1','P(0) + P(1)']]);
const P1=[
 {revise:'P(X = x) = nCx · p^x · q^(n − x). Usual mistake: forgetting nCx.',see:{t:'Revise: Week 7 · Binomial',href:'week-07.html'},check:[{l:'P(X = 2)',v:0.3087}],type:'One value',q:'n = 5, p = 0.3. Find P(X = 2).',
  hint:MG({f:'P(X = x) = nCx · p<sup>x</sup> · q<sup>n − x</sup>',d:'n = 5, x = 2, p = 0.3, q = 0.7',s:'5C2 · 0.3<sup>2</sup> · 0.7<sup>3</sup> = 10 × 0.09 × 0.343',k:'5 nCr 2 × 0 . 3 x² × 0 . 7 ^ 3 =',a:'<b>0.3087</b>'})},
 {revise:'At least 1 = 1 − P(X = 0). Usual mistake: adding P(1) to P(4) one by one and making an error.',see:{t:'Revise: Week 7 · Binomial',href:'week-07.html'},check:[{l:'P(X = 0)',v:0.0625},{l:'P(X ≥ 1)',v:0.9375}],type:'At least',q:'n = 4, p = 0.5. Find P(X = 0) and P(X ≥ 1).',
  hint:MG({f:'P(X ≥ 1) = 1 − P(X = 0)',s:'P(X = 0) = 4C0 · 0.5<sup>0</sup> · 0.5<sup>4</sup> = 0.0625',k:'1 − 0 . 0 6 2 5 =',a:'P(X = 0) = <b>0.0625</b> · P(X ≥ 1) = <b>0.9375</b>'})},
 {revise:'At most 1 = P(0) + P(1). Usual mistake: using only P(1).',see:{t:'Revise: Week 7 · Binomial',href:'week-07.html'},check:[{l:'P(X ≤ 1)',v:0.6554,tol:0.001}],type:'At most',q:'n = 6, p = 0.2. Find P(X ≤ 1).',
  hint:MG({f:'P(X ≤ 1) = P(X = 0) + P(X = 1)',s:'0.8<sup>6</sup> + 6 × 0.2 × 0.8<sup>5</sup> = 0.2621 + 0.3932',k:'0 . 8 ^ 6 + 6 × 0 . 2 × 0 . 8 ^ 5 =',a:'<b>0.6554</b>'})},
 {revise:'μ = np, σ = √(npq). Usual mistake: forgetting the square root.',see:{t:'Revise: Week 7 · Binomial',href:'week-07.html'},check:[{l:'μ',v:8},{l:'σ',v:2.1909,tol:0.005}],type:'Mean, SD',q:'n = 20, p = 0.4. Find the mean and the SD.',
  hint:MG({f:'μ = np · σ = √(npq)',s:'μ = 20 × 0.4 = 8 · σ = √(20 × 0.4 × 0.6) = √4.8',k:'√ ( 2 0 × 0 . 4 × 0 . 6 ) =',a:'μ = <b>8</b> · σ ≈ <b>2.19</b>'})},
 {revise:'Binomial needs a fixed n, two outcomes, the same p, and independent trials. Without replacement, p changes.',see:{t:'Revise: Week 7 · Binomial',href:'week-07.html'},check:[{l:'(a)',opts:['Binomial','Not binomial'],v:'Binomial'},{l:'(b)',opts:['Binomial','Not binomial'],v:'Not binomial'}],type:'Binomial?',q:'(a) A coin is tossed 10 times; X = number of heads. (b) 3 cards are drawn without replacement; X = number of hearts.',
  hint:steps([['(a)','<b>Binomial</b>: n = 10 fixed, head or not, p = 0.5 every time, tosses independent.'],['(b)','<b>Not binomial</b>: without replacement, p changes after each card, so the trials are not independent.'],['Answer','(a) Binomial · (b) Not binomial']])}];
const BIG1={revise:'Write n, p, q first. One value: nCx · p^x · q^(n − x). At least 1 = 1 − P(0). μ = np, σ = √(npq).',see:{t:'Revise: Week 7 · Binomial',href:'week-07.html'},check:[{l:'(a) P(X = 2)',v:0.3115,tol:0.001},{l:'(b) P(X = 0)',v:0.1001,tol:0.001},{l:'(c) P(X ≥ 1)',v:0.8999,tol:0.001},{l:'(d) μ',v:2},{l:'(d) σ',v:1.2247,tol:0.005}],
  q:'A student guesses all 8 questions of a multiple-choice test. Each question has 4 options, one correct.<ol class="parts" type="a"><li>P(exactly 2 correct)?</li><li>P(none correct)?</li><li>P(at least 1 correct)?</li><li>Mean and SD of the number correct.</li></ol>',
  hint:steps([['Write','n = 8, p = 0.25, q = 0.75'],['(a)','8C2 × 0.25<sup>2</sup> × 0.75<sup>6</sup> = 28 × 0.0625 × 0.1780 ≈ <b>0.3115</b>'],['(b)','0.75<sup>8</sup> ≈ <b>0.1001</b>'],['(c)','1 − 0.1001 = <b>0.8999</b>'],['Answer','(d) μ = 8 × 0.25 = <b>2</b> · σ = √(8 × 0.25 × 0.75) = √1.5 ≈ <b>1.22</b>']])};

/* ---------------- Part 2 · Normal ---------------- */
const NOR_LEAD=FORM([['z-score','z = (x − μ) ÷ σ'],['Back to x','x = μ + z · σ']])
 +FLOW('μ = 60, σ = 8, find P(X &lt; 70)',[['Draw and shade',bell('l')],['Find z','(70 − 60) ÷ 8 = 1.25'],['Read the table','row 1.2, column 0.05 → 0.8944']])
 +PICK('Then choose',[[bell('l'),'Less than','table'],[bell('r'),'More than','1 − table'],[bell('b'),'Between','big − small']]);
const P2=[
 {revise:'Less than → the table value directly.',see:{t:'Revise: Week 9 · The z-table',href:'week-09.html'},check:[{l:'z',v:1.25,tol:0.006},{l:'P(X < 70)',v:0.8944}],type:'Less than',q:'μ = 60, σ = 8. Find P(X &lt; 70).',
  hint:MG({f:'z = (x − μ) ÷ σ',s:'z = (70 − 60) ÷ 8 = 1.25',k:'( 7 0 − 6 0 ) ÷ 8 =',a:'table(1.25) = <b>0.8944</b>'})},
 {revise:'Greater than → 1 − table. Usual mistake: giving the table value 0.9452.',see:{t:'Revise: Week 9 · Greater than and between',href:'week-09.html'},check:[{l:'z',v:1.6,tol:0.006},{l:'P(X > 58)',v:0.0548}],type:'Greater than',q:'μ = 50, σ = 5. Find P(X &gt; 58).',
  hint:MG({f:'P(X &gt; x) = 1 − table(z)',s:'z = (58 − 50) ÷ 5 = 1.60 → table 0.9452',k:'1 − 0 . 9 4 5 2 =',a:'<b>0.0548</b>'})},
 {revise:'Between → table(big z) − table(small z).',see:{t:'Revise: Week 9 · Greater than and between',href:'week-09.html'},check:[{l:'P(85 < X < 115)',v:0.6826}],type:'Between',q:'μ = 100, σ = 15. Find P(85 &lt; X &lt; 115).',
  hint:MG({f:'table(z<sub>b</sub>) − table(z<sub>a</sub>)',s:'z<sub>a</sub> = −1.00 → 0.1587 · z<sub>b</sub> = 1.00 → 0.8413',k:'0 . 8 4 1 3 − 0 . 1 5 8 7 =',a:'<b>0.6826</b>'})},
 {revise:'Below the mean → negative z, area less than 0.5.',see:{t:'Revise: Week 9 · The z-table',href:'week-09.html'},check:[{l:'z',v:-1.5,tol:0.006},{l:'P(X < 155)',v:0.0668}],type:'Negative z',q:'Heights: μ = 170 cm, σ = 10 cm. Find P(X &lt; 155).',
  hint:MG({f:'z = (x − μ) ÷ σ',s:'z = (155 − 170) ÷ 10 = −1.50',k:'( 1 5 5 − 1 7 0 ) ÷ 1 0 =',a:'table(−1.50) = <b>0.0668</b>'})},
 {revise:'Area → z inside the table → x = μ + zσ. Top 10% → left area 0.90 → z ≈ 1.28.',see:{t:'Revise: Week 9 · From an area back to a value',href:'week-09.html'},check:[{l:'x',v:82.8,tol:0.15}],type:'Back to x',q:'Exam marks: μ = 70, σ = 10. What mark is needed to be in the top 10%?',
  hint:MG({f:'x = μ + z · σ',s:'Left area 0.90 → z = 1.28 · x = 70 + 1.28 × 10',k:'7 0 + 1 . 2 8 × 1 0 =',a:'x ≈ <b>82.8</b>'})}];
const BIG2={revise:'Draw and shade, find z, read the table: less than = table, greater than = 1 − table, between = subtract. Count = n × probability.',see:{t:'Revise: Week 9 · The z-table',href:'week-09.html'},check:[{l:'(a)',v:0.1587},{l:'(b)',v:0.0668},{l:'(c)',v:0.7745},{l:'(d)',v:13,tol:0.6}],
  q:'Phone battery life is normal with μ = 12 hours and σ = 2 hours.<ol class="parts" type="a"><li>P(battery lasts less than 10 h)?</li><li>P(more than 15 h)?</li><li>P(between 10 and 15 h)?</li><li>Out of 200 phones, about how many last more than 15 h?</li></ol>',
  hint:steps([['(a)','z = (10 − 12) ÷ 2 = −1.00 → <b>0.1587</b>'],['(b)','z = (15 − 12) ÷ 2 = 1.50 → 1 − 0.9332 = <b>0.0668</b>'],['(c)','0.9332 − 0.1587 = <b>0.7745</b>'],['Answer','(d) 200 × 0.0668 ≈ <b>13</b> phones']])};

/* ---------------- Part 3 · Confidence interval for the mean ---------------- */
const CI_LEAD=FORM([['Interval','x̄ ± z* · σ ÷ √n'],['σ unknown','x̄ ± t* · s ÷ √n (t* given)']])
 +FLOW('x̄ = 50, σ = 10, n = 25, 95%',[['Pick z*','95% → 1.96'],['SE = σ ÷ √n','10 ÷ 5 = 2'],['E = z* × SE','1.96 × 2 = 3.92'],['x̄ − E and x̄ + E','(46.08, 53.92)']])
 +PICK('z* to remember',[['','90%','1.645'],['','95%','1.96'],['','99%','2.576']]);
const P3=[
 {revise:'SE = σ ÷ √n, E = z* × SE, then x̄ ± E. 95% → 1.96.',see:{t:'Revise: Week 11 · Confidence intervals',href:'week-11.html'},check:[{l:'Lower',v:46.08,tol:0.01},{l:'Upper',v:53.92,tol:0.01}],type:'95%',q:'x̄ = 50, σ = 10, n = 25. Find the 95% confidence interval for μ.',
  hint:MG({f:'x̄ ± z* · σ ÷ √n',s:'SE = 10 ÷ √25 = 2 · E = 1.96 × 2 = 3.92',k:'5 0 − 1 . 9 6 × 1 0 ÷ √ 2 5 =',a:'(<b>46.08</b>, <b>53.92</b>)'})},
 {revise:'90% → z* = 1.645.',see:{t:'Revise: Week 11 · Confidence intervals',href:'week-11.html'},check:[{l:'Lower',v:115.065,tol:0.01},{l:'Upper',v:124.935,tol:0.01}],type:'90%',q:'x̄ = 120, σ = 18, n = 36. Find the 90% confidence interval for μ.',

 {revise:'99% → z* = 2.576: wider interval.',see:{t:'Revise: Week 11 · Confidence intervals',href:'week-11.html'},check:[{l:'Lower',v:7.6272,tol:0.01},{l:'Upper',v:9.1728,tol:0.01}],type:'99%',q:'x̄ = 8.4, σ = 1.2, n = 16. Find the 99% confidence interval for μ.',
  hint:MG({f:'x̄ ± z* · σ ÷ √n',s:'SE = 1.2 ÷ 4 = 0.3 · E = 2.576 × 0.3 = 0.7728',k:'8 . 4 − 2 . 5 7 6 × 0 . 3 =',a:'(<b>7.63</b>, <b>9.17</b>)'})},
 {revise:'σ unknown → use s and t* with df = n − 1 (t* is given).',see:{t:'Revise: Week 11 · Confidence intervals',href:'week-11.html'},check:[{l:'Lower',v:25.388,tol:0.01},{l:'Upper',v:34.612,tol:0.01}],type:'t-interval',q:'σ unknown: x̄ = 30, s = 6, n = 9, 95% (t* = 2.306 for df = 8). Find the interval.',

 {revise:'The confidence is about the method: 95% of such intervals contain μ. It is not about the data or about x̄.',see:{t:'Revise: Week 11 · Confidence intervals',href:'week-11.html'},check:[{l:'Meaning',opts:['A','B','C'],v:'A'}],type:'Meaning',q:'A 95% interval for the mean study time is (2.3, 2.7) hours. Which is right? <b>A</b>: We are 95% confident the population mean is between 2.3 and 2.7 h. <b>B</b>: 95% of students study between 2.3 and 2.7 h. <b>C</b>: The sample mean is between 2.3 and 2.7 h with probability 0.95.',
