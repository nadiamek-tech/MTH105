<script>
const {W} = Lecture; Lecture.__noLogo=true; const esc = W.esc;
const {T, fr, sq, SG, XB, PH, v} = F;
const goScene = i => { const b=document.querySelectorAll('.toc ol li button')[i]; if(b) b.click(); };
const practice = (items, label) => el => W.practice(el, items, {label: label||'Show answer', prefix: ''});
const FT='font-family="Schibsted Grotesk,Arial"', MONO='font-family="JetBrains Mono,monospace"';
const HOW='Method: as covered in class and in last Wednesday’s lab revision.';
/* Mind the Gap model answer: formula → decode → substitute → calculator → answer */
const MG=o=>`<div class="mg">${o.f?`<div><span>Formula</span><span>${o.f}</span></div>`:''}${o.d?`<div><span>Decode</span><span>${o.d}</span></div>`:''}${o.s?`<div><span>Substitute</span><span>${o.s}</span></div>`:''}${o.k?`<div><span>Calculator</span>${F.keys(o.k)}</div>`:''}<div class="fin"><span>Answer</span><span>${o.a}</span></div>${o.how===false?'':`<div class="how"><span>${HOW}</span></div>`}</div>`;
const steps=a=>`<div class="mg">${a.map(([l,t])=>`<div${l==='Answer'?' class="fin"':''}><span>${l}</span><span>${t}</span></div>`).join('')}<div class="how"><span>${HOW}</span></div></div>`;
const tbl=(h,rows)=>`<table class="tbl" style="margin:6px 0"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
function bars(vals,labels,xl){ const Wd=440,Hd=170,mx=Math.max(...vals),bw=(Wd-60)/vals.length; return `<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Bar chart">${[0,2,4,6,8].map(g=>`<line x1="34" x2="${Wd-10}" y1="${140-g*14}" y2="${140-g*14}" stroke="var(--line)"/><text x="28" y="${144-g*14}" text-anchor="end" ${MONO} font-size="10" fill="var(--muted)">${g}</text>`).join('')}${vals.map((v,i)=>`<rect x="${44+i*bw+bw*.2}" y="${140-v*14}" width="${bw*.6}" height="${v*14}" fill="var(--wk)" opacity=".75"/><text x="${44+i*bw+bw/2}" y="156" text-anchor="middle" ${MONO} font-size="11" fill="var(--ink)">${labels[i]}</text>`).join('')}<line x1="34" x2="${Wd-10}" y1="140" y2="140" stroke="var(--ink)"/><text x="${Wd/2}" y="${Hd-1}" text-anchor="middle" ${FT} font-size="11" fill="var(--muted)">${xl}</text></svg>`; }
function ogive(b,c,xl){ const Wd=440,Hd=190,L=34,R=12,T=10,B=34,n=c[c.length-1],X=i=>L+(Wd-L-R)*i/(b.length-1),Y=v=>T+(Hd-T-B)*(1-v/n); return `<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Ogive">${[0,10,20,30,40].map(g=>`<line x1="${L}" x2="${Wd-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(g)+4}" text-anchor="end" ${MONO} font-size="10" fill="var(--muted)">${g}</text>`).join('')}<polyline points="${c.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="var(--c3)" stroke-width="2.4"/>${c.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="var(--c3)"/><text x="${X(i)}" y="${Y(v)-8}" text-anchor="middle" ${MONO} font-size="10" fill="var(--ink)">${v}</text><text x="${X(i)}" y="${Hd-B+16}" text-anchor="middle" ${MONO} font-size="10" fill="var(--muted)">${b[i]}</text>`).join('')}<text x="${(L+Wd-R)/2}" y="${Hd-3}" text-anchor="middle" ${FT} font-size="11" fill="var(--muted)">${xl}</text></svg>`; }
function venn(a,ab,b,ne,A,Bn){ return `<svg viewBox="0 0 300 150" style="max-width:300px" role="img" aria-label="Venn diagram"><rect x="2" y="2" width="296" height="146" rx="8" fill="none" stroke="var(--ink)"/><circle cx="118" cy="78" r="56" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"/><circle cx="182" cy="78" r="56" fill="rgba(31,99,181,.08)" stroke="var(--c2)" stroke-width="2"/><text x="78" y="20" ${FT} font-weight="700" font-size="12" fill="var(--wk)">${A}</text><text x="198" y="20" ${FT} font-weight="700" font-size="12" fill="var(--c2)">${Bn}</text>${[[92,a],[150,ab],[208,b],[272,ne]].map(([x,v],i)=>`<text x="${x}" y="${i===3?136:84}" text-anchor="middle" ${FT} font-weight="800" font-size="16" fill="var(--ink)">${v}</text>`).join('')}</svg>`; }
const box=(f,lo,hi,st,xl,out)=>ST.boxSVG(f,lo,hi,st,{labels:true,out:out||[],xlabel:xl});

/* ---------------- Part 1 · Graphical representation ---------------- */
const P1A=[
 {type:'Histogram',q:`Minutes to finish a quiz (30 students). Draw the histogram.${tbl(['Class','10–14','15–19','20–24','25–29','30–34'],[['f',3,7,10,6,4]])}`,
  hint:steps([['Step 1','Boundaries: 9.5, 14.5, 19.5, 24.5, 29.5, 34.5 (subtract and add 0.5).'],['Step 2','x-axis = boundaries, y-axis = frequency. Bars <b>touch</b>.'],['Answer',ST.hist([3,7,10,6,4],['9.5','14.5','19.5','24.5','29.5','34.5'],{ymax:11,xlabel:'Minutes'})+'Shape: roughly <b>symmetric</b>, peak at 20–24.']])},
 {type:'Polygon',q:`Ages of 40 marathon runners. Draw the frequency polygon.${tbl(['Class','20–29','30–39','40–49','50–59','60–69'],[['f',6,14,11,7,2]])}`,
  hint:steps([['Step 1','Midpoints: 24.5, 34.5, 44.5, 54.5, 64.5.'],['Step 2','Plot (midpoint, f) and join with straight lines.'],['Step 3','Close on the axis: add 14.5 and 74.5 with f = 0.'],['Answer',ST.hist([6,14,11,7,2],['19.5','29.5','39.5','49.5','59.5','69.5'],{pad:true,poly:true,ymax:15,xlabel:'Age (years)'})]])},
 {type:'Table + histogram',q:'Plastic recycled (kg/month) by 20 households: 2, 3, 5, 6, 6, 7, 8, 8, 9, 9, 10, 11, 11, 12, 13, 14, 15, 17, 19, 22. Use classes 0–4, 5–9, 10–14, 15–19, 20–24. Build the frequency table and draw the histogram and polygon.',
  hint:steps([['Step 1','Tally: 0–4: <b>2</b> · 5–9: <b>8</b> · 10–14: <b>6</b> · 15–19: <b>3</b> · 20–24: <b>1</b> (total 20).'],['Step 2','Midpoints 2, 7, 12, 17, 22.'],['Answer',ST.hist([2,8,6,3,1],['−0.5','4.5','9.5','14.5','19.5','24.5'],{pad:true,poly:true,ymax:9,xlabel:'kg'})+'Shape: <b>right-skewed</b>.']])},
 {type:'Boxplot',q:'Waiting times (min) of 11 patients: 5, 8, 9, 10, 12, 13, 15, 16, 18, 22, 35. Draw the boxplot. Check for outliers.',
  hint:steps([['Step 1','Median: position (11 + 1) ÷ 2 = 6th → <b>13</b>.'],['Step 2','Lower half 5, 8, 9, 10, 12 → Q1 = <b>9</b>. Upper half 15, 16, 18, 22, 35 → Q3 = <b>18</b>.'],['Step 3','IQR = 9. Fences: 9 − 13.5 = −4.5 and 18 + 13.5 = 31.5 → <b>35 is an outlier</b>; the whisker stops at 22.'],['Answer',box([5,9,13,18,22],0,40,5,'Minutes',[35])]])},
 {type:'Boxplot',q:'Daily water intake (L) of 10 athletes: 1.8, 2.0, 2.2, 2.4, 2.5, 2.7, 2.9, 3.0, 3.2, 3.6. Draw the boxplot.',
  hint:steps([['Step 1','n = 10 (even): median = (2.5 + 2.7) ÷ 2 = <b>2.6</b>.'],['Step 2','Lower half 1.8 … 2.5 → Q1 = <b>2.2</b>. Upper half 2.7 … 3.6 → Q3 = <b>3.0</b>.'],['Step 3','IQR = 0.8. Fences 1.0 and 4.2 → no outliers.'],['Answer',box([1.8,2.2,2.6,3.0,3.6],1.5,4,0.5,'Litres')]])}];
const P1B=[
 {type:'Read a boxplot',q:`Battery life of 120 phones (hours):${box([6,9,11,14,20],4,22,2,'Hours')}Find min, max, range, Q1, median, Q3, IQR. How many phones last more than 14 hours?`,
  hint:steps([['Read','Min <b>6</b> · Q1 <b>9</b> · Median <b>11</b> · Q3 <b>14</b> · Max <b>20</b>'],['Calculate','Range = 20 − 6 = <b>14</b>. IQR = 14 − 9 = <b>5</b>.'],['Answer','Above Q3 = 25% → 0.25 × 120 = <b>30 phones</b>.']])},
 {type:'Read a histogram',q:`Exam scores of a class:${ST.hist([2,5,9,6,3],['49.5','59.5','69.5','79.5','89.5','99.5'],{ymax:10,xlabel:'Score'})}How many students? Modal class? In which class is the median? What % scored 80 or more?`,
  hint:steps([['Read','f = 2, 5, 9, 6, 3 → n = <b>25</b>.'],['Modal class','Tallest bar: <b>70–79</b>.'],['Median','Position (25 + 1) ÷ 2 = 13th. Cumulative: 2, 7, 16 → the 13th is in <b>70–79</b>.'],['Answer','80 or more: 6 + 3 = 9 → 9 ÷ 25 = <b>36%</b>.']])},
 {type:'Read a bar chart',q:`Number of siblings of 20 students:${bars([3,7,6,3,1],['0','1','2','3','4'],'Siblings')}Find the mode, median, Q1, Q3, IQR, range and mean.`,
  hint:steps([['Read','0: 3 · 1: 7 · 2: 6 · 3: 3 · 4: 1 → n = 20. Cumulative 3, 10, 16, 19, 20.'],['Mode','Tallest bar: <b>1</b>.'],['Median','10th and 11th values: 1 and 2 → <b>1.5</b>.'],['Quartiles','Q1 = (5th + 6th) ÷ 2 = <b>1</b>. Q3 = (15th + 16th) ÷ 2 = <b>2</b>. IQR = <b>1</b>.'],['Answer','Range = 4 − 0 = <b>4</b>. Mean = (0 + 7 + 12 + 9 + 4) ÷ 20 = 32 ÷ 20 = <b>1.6</b>.']])},
 {type:'Read an ogive',q:`Commute times of students:${ogive([0,10,20,30,40,50],[0,6,18,30,36,40],'Minutes · cumulative frequency')}How many students? How many take less than 30 min? What % take more than 40 min? How many take 10–20 min?`,
  hint:steps([['Read','Last point = <b>40</b> students.'],['Less than 30','Cumulative at 30 = <b>30</b> students (75%).'],['More than 40','40 − 36 = 4 → 4 ÷ 40 = <b>10%</b>.'],['Answer','10–20 min: 18 − 6 = <b>12</b> students.']])},
 {type:'Compare boxplots',q:`Quiz scores of two sections:<p class="mono" style="margin:4px 0">Section A</p>${box([40,55,65,75,90],35,95,5,'')}<p class="mono" style="margin:4px 0">Section B</p>${box([50,60,70,72,85],35,95,5,'Score')}Which section has the higher median? Which has more spread (range and IQR)?`,
  hint:steps([['Read A','40, 55, 65, 75, 90'],['Read B','50, 60, 70, 72, 85'],['Median','A = 65, B = 70 → <b>B</b> is higher.'],['Answer','Range: A = 50, B = 35. IQR: A = 20, B = 12. <b>A</b> has more spread.']])}];

/* ---------------- Part 2 · Calculations ---------------- */
const P2A=[
 {type:'Mean',q:'Daily steps (thousands) of 5 students: 6, 8, 9, 10, 12. Find the mean.',
  hint:MG({f:'x̄ = Σx ÷ n',d:'x̄ = mean · Σ = add all · x = each value · n = how many',s:'x̄ = (6 + 8 + 9 + 10 + 12) ÷ 5',k:'( 6 + 8 + 9 + 1 0 + 1 2 ) ÷ 5 =',a:'x̄ = 45 ÷ 5 = <b>9 thousand steps</b>'})},
 {type:'Median (odd n)',q:'Minutes spent on homework: 14, 9, 21, 17, 12, 25, 11. Find the median.',
  hint:MG({f:'Median position = (n + 1) ÷ 2',d:'Sort first. n = 7',s:'Sorted: 9, 11, 12, <b>14</b>, 17, 21, 25 · position (7 + 1) ÷ 2 = 4',a:'Median = <b>14 minutes</b>'})},
 {type:'Median (even n)',q:'Hours of exercise per week: 3.5, 4.0, 2.5, 5.0, 4.5, 3.0. Find the median and the mean.',
  hint:MG({f:'Even n: median = average of the two middle values',d:'n = 6 → middle positions 3 and 4',s:'Sorted: 2.5, 3.0, <b>3.5, 4.0</b>, 4.5, 5.0 → (3.5 + 4.0) ÷ 2',k:'( 3 . 5 + 4 ) ÷ 2 =',a:'Median = <b>3.75</b> h. Mean = 22.5 ÷ 6 = <b>3.75</b> h'})},
 {type:'Mode',q:'(a) Number of pets: 2, 3, 3, 4, 5, 5, 6. (b) Transport: Metro, Car, Car, Bus, Metro, Car. Find the mode of each.',
  hint:MG({f:'Mode = most frequent value',d:'Count each value',s:'(a) 3 → twice, 5 → twice · (b) Car → 3 times',a:'(a) <b>3 and 5</b> (bimodal) · (b) <b>Car</b>'})},
 {type:'Which centre?',q:'Monthly salaries (thousand AED) of 6 staff: 8, 9, 9, 10, 11, 40. Find mean, median and mode. Which is the best typical value?',
  hint:MG({f:'x̄ = Σx ÷ n · median at (n + 1) ÷ 2',s:'x̄ = 87 ÷ 6 · median = (9 + 10) ÷ 2',k:'( 8 + 9 + 9 + 1 0 + 1 1 + 4 0 ) ÷ 6 =',a:'Mean = <b>14.5</b> · Median = <b>9.5</b> · Mode = <b>9</b>. The outlier 40 pulls the mean up (right-skewed) → use the <b>median</b>.'})}];
const P2B=[
 {type:'Range and IQR',q:'Data: 12, 15, 17, 18, 20, 22, 25, 28, 31. Find the range, Q1, Q3 and IQR.',
  hint:MG({f:'Range = max − min · IQR = Q3 − Q1',d:'n = 9 → median is the 5th value (20); leave it out of both halves',s:'Lower half 12, 15, 17, 18 → Q1 = (15 + 17) ÷ 2 · Upper half 22, 25, 28, 31 → Q3 = (25 + 28) ÷ 2',a:'Range = 31 − 12 = <b>19</b> · Q1 = <b>16</b> · Q3 = <b>26.5</b> · IQR = <b>10.5</b>'})},
 {type:'Variance and SD',q:'Data: 4, 7, 8, 9, 12. Find the sample variance and standard deviation.',
  hint:MG({f:'s² = Σ(x − x̄)² ÷ (n − 1) · s = √s²',d:'Mean x̄ = 40 ÷ 5 = 8 · subtract, square, add, divide by n − 1',s:'(−4)² + (−1)² + 0² + 1² + 4² = 16 + 1 + 0 + 1 + 16 = 34',k:'( 1 6 + 1 + 0 + 1 + 1 6 ) ÷ ( 5 − 1 ) =',a:'s² = 34 ÷ 4 = <b>8.5</b> · s = √8.5 ≈ <b>2.92</b>'})},
 {type:'Variance, SD, CV',q:'Data: 10, 12, 14, 16, 18. Find s², s and CV.',
  hint:MG({f:'s² = Σ(x − x̄)² ÷ (n − 1) · CV = s ÷ x̄ × 100%',d:'x̄ = 70 ÷ 5 = 14',s:'(−4)² + (−2)² + 0² + 2² + 4² = 40 → s² = 40 ÷ 4',k:'√ 1 0 ÷ 1 4 × 1 0 0 =',a:'s² = <b>10</b> · s ≈ <b>3.16</b> · CV = 3.16 ÷ 14 × 100% ≈ <b>22.6%</b>'})},
 {type:'Compare with CV',q:'Exam A: mean 60, s = 12. Exam B: mean 75, s = 9. Which exam has more consistent results?',
  hint:MG({f:'CV = s ÷ x̄ × 100%',d:'Smaller CV = more consistent',s:'CV<sub>A</sub> = 12 ÷ 60 × 100% · CV<sub>B</sub> = 9 ÷ 75 × 100%',k:'1 2 ÷ 6 0 × 1 0 0 =',a:'A = <b>20%</b>, B = <b>12%</b> → <b>Exam B</b> is more consistent.'})},
 {type:'Full summary',q:'Daily maximum temperature (°C) for 5 days: 21, 23, 25, 25, 26. Find the range, IQR, s², s and CV.',
  hint:MG({f:'Range · IQR · s² = Σ(x − x̄)² ÷ (n − 1) · s · CV',d:'x̄ = 120 ÷ 5 = 24 · median = 25 · halves 21, 23 and 25, 26',s:'Range = 26 − 21 · Q1 = 22, Q3 = 25.5 · (−3)² + (−1)² + 1² + 1² + 2² = 16',k:'1 6 ÷ ( 5 − 1 ) =',a:'Range <b>5</b> · IQR <b>3.5</b> · s² <b>4</b> · s <b>2</b> · CV = 2 ÷ 24 ≈ <b>8.3%</b>'})}];

/* ---------------- Part 3 · Probability rules ---------------- */
const RULES=`<table class="tbl"><tr><th>Word</th><th>Rule</th><th>Formula</th></tr>
 <tr><td>—</td><td>Simple</td><td>P(E) = favourable ÷ total</td></tr>
 <tr><td><b>NOT</b></td><td>Complement</td><td>P(not A) = 1 − P(A)</td></tr>
 <tr><td><b>OR</b></td><td>Addition</td><td>No overlap (mutually exclusive): P(A) + P(B)<br>Overlap (BOTH given): P(A) + P(B) − P(A and B)</td></tr>
 <tr><td><b>AND</b></td><td>Multiplication</td><td>Independent: P(A) × P(B). Fair choice of 2 → each is 1/2</td></tr></table>`;
const P3A=[
 {type:'Simple',q:'A bag has 4 green and 6 red marbles. One is picked at random. P(green)?',hint:MG({f:'P(E) = favourable ÷ total',s:'4 ÷ (4 + 6)',a:'P(green) = <b>0.4</b>'})},
 {type:'Simple',q:'A spinner has 8 equal sections numbered 1 to 8. P(a number greater than 5)?',hint:MG({f:'P(E) = favourable ÷ total',d:'Greater than 5: {6, 7, 8} → 3 outcomes',s:'3 ÷ 8',a:'<b>0.375</b>'})},
 {type:'Simple',q:'A class has 10 Business, 8 Engineering and 7 Design students. One is chosen at random. P(Engineering)?',hint:MG({f:'P(E) = favourable ÷ total',s:'8 ÷ 25',a:'<b>0.32</b>'})},
 {type:'Complement',q:'P(the bus is late) = 0.15. P(the bus is not late)?',hint:MG({f:'P(not A) = 1 − P(A)',s:'1 − 0.15',a:'<b>0.85</b>'})},
 {type:'Complement',q:'12% of products are defective. P(a product is not defective)?',hint:MG({f:'P(not A) = 1 − P(A)',s:'1 − 0.12',a:'<b>0.88</b>'})},
 {type:'Complement',q:'Same spinner (1 to 8). P(not an 8)?',hint:MG({f:'P(not A) = 1 − P(A)',s:'1 − 1/8',k:'1 − 1 ÷ 8 =',a:'<b>7/8 = 0.875</b>'})}];
const P3B=[
 {type:'OR · no overlap',q:'A student picks one elective: Arabic 0.35, French 0.25, Chinese 0.40. P(Arabic or Chinese)?',hint:MG({f:'Mutually exclusive: P(A or B) = P(A) + P(B)',d:'Only one elective → no BOTH',s:'0.35 + 0.40',a:'<b>0.75</b>'})},
 {type:'OR · no overlap',q:'Roll a fair die. P(1 or 6)?',hint:MG({f:'P(A or B) = P(A) + P(B)',d:'Cannot get 1 and 6 at once',s:'1/6 + 1/6',a:'2/6 ≈ <b>0.333</b>'})},
 {type:'OR · no overlap',q:'One mode of transport: P(walk) = 0.10, P(bike) = 0.05. P(walk or bike)?',hint:MG({f:'P(A or B) = P(A) + P(B)',s:'0.10 + 0.05',a:'<b>0.15</b>'})},
 {type:'OR · with BOTH',q:'Of 50 people, 30 drink coffee, 20 drink tea and 10 drink both. Draw the Venn diagram. P(coffee or tea)?',hint:MG({f:'P(C or T) = P(C) + P(T) − P(C and T)',d:'BOTH is given → subtract it once',s:'30/50 + 20/50 − 10/50 = 40/50',a:venn(20,10,10,10,'Coffee','Tea')+'P(C or T) = <b>0.8</b> · neither = 10/50 = 0.2'})},
 {type:'OR · with BOTH',q:'Of 80 students, 45 use Instagram, 35 use TikTok and 20 use both. Draw the Venn diagram. P(Instagram or TikTok)? P(neither)?',hint:MG({f:'P(I or T) = P(I) + P(T) − P(I and T)',s:'45/80 + 35/80 − 20/80 = 60/80',a:venn(25,20,15,20,'Instagram','TikTok')+'P(I or T) = <b>0.75</b> · P(neither) = 1 − 0.75 = <b>0.25</b>'})},
 {type:'OR · with BOTH',q:'P(A) = 0.5, P(B) = 0.3, P(A and B) = 0.1. Find P(A or B) and P(neither). Show the Venn diagram.',hint:MG({f:'P(A or B) = P(A) + P(B) − P(A and B)',s:'0.5 + 0.3 − 0.1',a:venn('0.4','0.1','0.2','0.3','A','B')+'P(A or B) = <b>0.7</b> · P(neither) = <b>0.3</b>'})}];
const P3C=[
 {type:'AND',q:'Toss a fair coin twice. P(heads and heads)?',hint:MG({f:'Independent: P(A and B) = P(A) × P(B)',d:'Fair coin → each side 1/2',s:'1/2 × 1/2',k:'0 . 5 × 0 . 5 =',a:'<b>1/4 = 0.25</b>'})},
 {type:'AND',q:'Toss a fair coin and spin a spinner with two equal halves (red, blue). P(tails and blue)?',hint:MG({f:'P(A and B) = P(A) × P(B)',s:'1/2 × 1/2',a:'<b>0.25</b>'})},
 {type:'AND',q:'Toss a fair coin three times. P(heads, heads, heads)?',hint:MG({f:'P(A and B and C) = P(A) × P(B) × P(C)',s:'1/2 × 1/2 × 1/2',k:'0 . 5 ^ 3 =',a:'<b>1/8 = 0.125</b>'})}];

/* ---------------- Part 4 · Tree diagrams ---------------- */
const P4=[
 {type:'Draw',q:'A student is chosen at random: Male or Female. Then a lab session is assigned at random: Morning or Evening. Draw the tree, list the sample space and find P(Female and Evening).',
  hint:steps([['Tree',ST.treeSVG([['Male','Female'],['Morning','Evening']],{hl:['Female, Evening']})],['Sample space','{(M, Mo), (M, Ev), (F, Mo), (F, Ev)} → 2 × 2 = <b>4</b> outcomes'],['Answer','AND → multiply along the path: 1/2 × 1/2 = <b>1/4</b>']])},
 {type:'Draw',q:'Toss a coin (H or T), then spin a fair red/blue spinner. Draw the tree. Find P(H and red) and P(red).',
