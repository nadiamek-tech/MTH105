const {W} = Lecture; Lecture.__noLogo=true; const esc = W.esc;

/* Quiz 2 brief lecture: for a student who missed the classes. Per chapter: what it is, key words, coloured formulas,
   how to get each value (calculator keys, z-table, critical-value table), one exercise solved step by step with every decision. */

/* ---------- colour helpers (green = top of fraction, red = bottom, purple = brackets, orange = + and Σ) ---------- */
const CT=s=>s.replace(/[()]/g,c=>`<span class="kb">${c}</span>`).replace(/[+Σ]/g,c=>`<span class="ks">${c}</span>`);
const FR=(n,d)=>`<span class="fr"><span class="n">${CT(n)}</span><span class="d">${CT(d)}</span></span>`;
const EQ=h=>`<div class="eq">${h}</div>`;
const V=(s,c='v1')=>`<span class="${c}">${s}</span>`;           // coloured value
const ANS=s=>`<span class="ans">${s}</span>`;
const KEYS=(ks,res)=>`<div class="keys"><span class="kl">Calculator</span>${ks.map(k=>`<kbd${/^(SHIFT|nCr|=|x²|√|\^|Ans)$/.test(k)?' class="fn"':''}>${k}</kbd>`).join('')}${res!==undefined?`<span class="kr">${res}</span>`:''}</div>`;
const CALC=(e,r)=>`<div class="cimg">${Board.calc(e,r)}</div>`;
const DECIDE=(q,a)=>`<div class="decide"><span class="dq">Decide · ${q}</span><span class="da">${a}</span></div>`;
const STEP=(n,title,why,body,side='')=>`<div class="step"><div class="sn">${n}</div><div class="sb"><div class="st">${title}</div>${why?`<div class="sw">${why}</div>`:''}${body}</div>${side?`<div class="ss">${side}</div>`:''}</div>`;
const BOX=(cls,title,body)=>`<div class="box ${cls}"><div class="bt">${title}</div>${body}</div>`;
const WORDS=a=>`<div class="words">${a.map(([s,m])=>`<div><b>${s}</b><span>${m}</span></div>`).join('')}</div>`;
const MIS=(bad,good)=>`<div class="mis"><div class="bad"><b>✗ Mistake</b>${bad}</div><div class="good"><b>✓ Correct</b>${good}</div></div>`;
const CH=[];
/* ---------- confidence-interval practice: 6 exercises, the same 5 steps every time ---------- */
const n4=x=>{const r=Math.round(x*10000)/10000;return String(r).replace("-","−");};
const ZS={'90%':'1.645','95%':'1.96','99%':'2.576'};
const EXS=[
 {id:'ex1',t:'Delivery time',q:'A food-delivery app checks 36 orders. The mean delivery time is x̄ = 28 minutes. The population SD is σ = 6 minutes.',lv:'95%',xb:28,sd:6,n:36,u:'minutes',what:'the mean delivery time of all orders',worked:true},
 {id:'ex2',t:'Hours of sleep',q:'100 students record their sleep. The mean is x̄ = 6.8 hours, with σ = 1.5 hours.',lv:'90%',xb:6.8,sd:1.5,n:100,u:'hours',what:'the mean sleep time of all students'},
 {id:'ex3',t:'Mobile data',q:'64 phone users are checked. Their mean monthly data use is x̄ = 18 GB, with σ = 8 GB.',lv:'99%',xb:18,sd:8,n:64,u:'GB',what:'the mean monthly data use of all users'},
 {id:'ex4',t:'Taxi fares',q:'81 taxi trips in Dubai have a mean fare of x̄ = 45 AED, with σ = 9 AED.',lv:'95%',xb:45,sd:9,n:81,u:'AED',what:'the mean fare of all trips'},
 {id:'ex5',t:'Water bottles',q:'A factory checks 16 bottles. The mean volume is x̄ = 502 ml and the sample SD is s = 4 ml. σ is not known. For 95% and df = 15, t* = 2.131.',lv:'95%',xb:502,sd:4,n:16,u:'ml',what:'the mean volume of all bottles',ts:'2.131'},
 {id:'ex6',t:'Commute time',q:'49 employees report a mean commute of x̄ = 35 minutes, with σ = 14 minutes.',lv:'95%',xb:35,sd:14,n:49,u:'minutes',what:'the mean commute time of all employees'}];

const SOLVE=x=>{const cs=x.ts||ZS[x.lv],c=parseFloat(cs),se=x.sd/Math.sqrt(x.n),E=c*se;return {cs,se,E,lo:x.xb-E,hi:x.xb+E};};
const ZTAB=lv=>`<div class="tw"><table class="ct"><tr><th>Confidence</th><th>z*</th></tr>${Object.entries(ZS).map(([k,v])=>`<tr class="${k===lv?'hr':''}"><td>${k}</td><td class="${k===lv?'hit':''}">${v}</td></tr>`).join('')}</table></div>`;

const LINE=(x,S)=>{const lo=n4(Math.round(S.lo*100)/100),hi=n4(Math.round(S.hi*100)/100),E=n4(S.E);
 return `<div class="ciline"><div class="cl-lo"><span class="cl-t">Lower</span><span class="cl-f">x̄ − E</span><span class="cl-f">${x.xb} − ${E}</span><b>${lo}</b></div>
 <div class="cl-mid"><span class="cl-t">Centre</span><span class="cl-f">x̄</span><b>${x.xb}</b></div>
 <div class="cl-hi"><span class="cl-t">Upper</span><span class="cl-f">x̄ + E</span><span class="cl-f">${x.xb} + ${E}</span><b>${hi}</b></div></div>
 <svg class="cinum" viewBox="0 0 600 70" aria-label="Interval from ${lo} to ${hi}"><line x1="20" y1="40" x2="580" y2="40" stroke="currentColor" stroke-width="1.5"/>
 <line x1="120" y1="40" x2="480" y2="40" stroke="var(--c1)" stroke-width="7" stroke-linecap="round" opacity=".85"/>
 <line x1="120" y1="26" x2="120" y2="54" stroke="var(--cr)" stroke-width="3"/><line x1="480" y1="26" x2="480" y2="54" stroke="var(--cg)" stroke-width="3"/>
 <circle cx="300" cy="40" r="7" fill="var(--c2)"/>
 <text x="120" y="18" text-anchor="middle" font-size="15" font-weight="700" fill="var(--cr)">${lo}</text><text x="300" y="18" text-anchor="middle" font-size="15" font-weight="700" fill="var(--c2)">x̄ = ${x.xb}</text><text x="480" y="18" text-anchor="middle" font-size="15" font-weight="700" fill="var(--cg)">${hi}</text>
 <text x="210" y="66" text-anchor="middle" font-size="12" fill="currentColor">− E = ${E}</text><text x="390" y="66" text-anchor="middle" font-size="12" fill="currentColor">+ E = ${E}</text></svg>`;};
const STEPS5=[
 ['Write the data','x̄, σ (or s), n and the confidence level.'],
 ['Critical value','σ known → z* from the confidence level. σ unknown → t* (given).'],
 ['Standard error','SE = σ ÷ √n.'],
 ['Margin of error','E = critical value × SE.'],
 ['Interval and meaning','x̄ − E to x̄ + E, then one sentence in context.']];

const EXHTML=(x,k)=>{const S=SOLVE(x),sym=x.ts?'s':'σ',cv=x.ts?'t*':'z*';
 const ans=[
  EQ(`x̄ = ${V(x.xb)}`)+EQ(`${sym} = ${V(x.sd,'v2')}`)+EQ(`n = ${V(x.n,'v3')}`)+EQ(`confidence = ${V(x.lv)}`),
  x.ts?EQ(`σ unknown → use t*`)+EQ(`t* = ${V(x.ts,'v2')}  (given, df = ${x.n} − 1 = ${x.n-1})`)+`<p class="note">t* is always given in the question.</p>`
     :EQ(`σ known → use z*`)+ZTAB(x.lv)+EQ(`z* = ${V(S.cs,'v2')}`)+`<p class="note">In exams, z* is sometimes given in the question: then use it directly.</p>`,
  EQ(`SE = ${FR(sym,'√n')} = ${FR(String(x.sd),'√'+x.n)} = ${FR(String(x.sd),String(Math.sqrt(x.n)))} = ${V(n4(S.se))}`),
  EQ(`E = ${cv} × SE = ${S.cs} × ${n4(S.se)} = ${V(n4(S.E))}`),
  LINE(x,S)+EQ(`${x.lv} CI: ${ANS('('+n4(Math.round(S.lo*100)/100)+' , '+n4(Math.round(S.hi*100)/100)+') '+x.u)}`)+
  `<p class="say">We are ${x.lv} confident that ${x.what} is between ${n4(Math.round(S.lo*100)/100)} and ${n4(Math.round(S.hi*100)/100)} ${x.u}.</p>`];
 return `<div class="ex"><b>${x.q}</b> Find the ${x.lv} confidence interval for the population mean μ and interpret it.</div>
  <div class="s5">${STEPS5.map(([t,why],s)=>`<div class="s5-i"><div class="s5-h"><span class="sn">${s+1}</span><div><div class="st">${t}</div><div class="sw">${why}</div></div>
   <button type="button" class="pill s5-b" aria-expanded="${x.worked?'true':'false'}">${x.worked?'Hide':'Show'}</button></div><div class="s5-a"${x.worked?'':' hidden'}>${ans[s]}</div></div>`).join('')}</div>`;};

CH.push(...EXS.map((x,k)=>({id:x.id,wk:k===0?'Worked example':'Exercise '+(k+1),t:x.t,html:EXHTML(x,k)})));

const STEPBAR=`<div class="sbar">${STEPS5.map(([t],i)=>`<div style="background:var(${['--c1','--c2','--cr','--c3','--cg'][i]})"><b>${i+1}</b>${t}</div>`).join('')}</div>`;

  body.q2l{--c1:#1F63B5;--c2:#B5651D;--c3:#7c3aed;--cg:#15803d;--cr:#c62828;--ck:#7c3aed;--cs:#ea580c}

  document.body.classList.add('lesson','q2l');
  const el=(t,a={},h='')=>{ const e=document.createElement(t); Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v)); if(h) e.innerHTML=h; return e; };

  const bar=el('header',{class:'lbar'});
  bar.innerHTML=`<div class="lbar-in"><a class="brand" href="exams.html"><b>MTH 105</b><span>← Exams · Confidence interval practice</span></a>
    <nav class="lchips" aria-label="Chapters">${CH.map((w,i)=>`<a href="#${w.id}" data-id="${w.id}">${i===0?'Example':'Ex '+(i+1)}</a>`).join('')}</nav>
    <div class="lctl"><button type="button" class="pill" id="pr-top">Print / PDF</button><button type="button" class="pill" id="theme" title="Light or dark">◐</button></div></div><div class="progress"><i></i></div>`;
  document.body.appendChild(bar);
  bar.querySelector('#theme').addEventListener('click',()=>GED102Theme.toggle());
  bar.querySelector('#pr-top').addEventListener('click',()=>window.print());

  const main=el('main',{class:'ql-main'});
  const cover=el('section',{class:'ql-cover'});
  cover.innerHTML=`<div class="ql-top"><span>MTH 105 · Introduction to Statistics</span><span>Fall 2026 · Nadia</span></div>
    <h1>Confidence interval for the mean · 5 steps</h1><p>One method for every question: data → critical value → SE → margin of error → interval and meaning. Try each step, then press Show.</p>${STEPBAR}
    <ol class="ql-toc">${CH.map(w=>`<li><a href="#${w.id}"><small>${w.wk}</small>${w.t}</a></li>`).join('')}</ol>
    <div class="ql-tools"><a class="btn" href="downloads/MTH105-CI-practice.pdf" download>Download PDF</a> <button type="button" class="btn" id="showall">Show all answers</button> <button type="button" class="btn" id="pr">Print / Save as PDF</button></div>`;
  main.appendChild(cover);
  cover.querySelector('#pr').addEventListener('click',()=>window.print());
  CH.forEach((w,i)=>{
    const s=el('section',{class:'ch',id:w.id});
    s.innerHTML=`<div class="ch-h"><h2><small>${w.wk}</small>${w.t}</h2><a href="week-11.html">Week 11 lecture →</a></div>${w.html}`;
    main.appendChild(s);
  });
  document.body.appendChild(main);
  document.body.appendChild(el('p',{class:'support-note'},'This website is interactive course support. It does not replace classes, attendance or class activities.'));

  const chips=[...bar.querySelectorAll('.lchips a')];main.querySelectorAll('.s5-b').forEach(b=>b.addEventListener('click',()=>{const a=b.closest('.s5-i').querySelector('.s5-a'),o=a.hidden;a.hidden=!o;b.textContent=o?'Hide':'Show';b.setAttribute('aria-expanded',String(o));}));const allb=cover.querySelector('#showall');allb&&allb.addEventListener('click',()=>{const open=allb.dataset.o!=='1';main.querySelectorAll('.s5-i').forEach(i=>{const a=i.querySelector('.s5-a'),b=i.querySelector('.s5-b');a.hidden=!open;b.textContent=open?'Hide':'Show';b.setAttribute('aria-expanded',String(open));});allb.dataset.o=open?'1':'0';allb.textContent=open?'Hide all answers':'Show all answers';}), secs=[...main.querySelectorAll('.ch')];
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) chips.forEach(c=>c.classList.toggle('on',c.dataset.id===e.target.id)); }),{rootMargin:'-20% 0px -70% 0px'});
  secs.forEach(x=>io.observe(x));
  const onScroll=()=>{ const d=document.documentElement; bar.querySelector('.progress i').style.width=(d.scrollTop/((d.scrollHeight-d.clientHeight)||1)*100)+'%'; };
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
  const h=location.hash.slice(1); if(h&&document.getElementById(h)) setTimeout(()=>document.getElementById(h).scrollIntoView(),60);
})();
